      /* ---------- inventário ---------- */
      VIEWS.inv = () => {
        if (!can("inv"))
          return `<h1>📋 Inventário</h1>${emptyBox("🔒", "Seu perfil não permite fazer inventário.")}`;
        const L = db.products.filter(
          (p) => p.active && (!inv.cat || p.category === inv.cat),
        );
        const diffs = L.filter(
          (p) =>
            inv.counts[p.id] !== undefined &&
            inv.counts[p.id] !== "" &&
            +inv.counts[p.id] !== p.qty,
        );
        return `<h1>📋 Inventário</h1><p class="muted">Escolha uma categoria, informe o que contou e confirme. O resto do sistema segue funcionando normalmente.</p>
       <select onchange="inv.cat=this.value;inv.counts={};render()"><option value="">Todos os produtos</option>${db.cats.map((c) => `<option ${c === inv.cat ? "selected" : ""}>${esc(c)}</option>`).join("")}</select><br><br>
       ${
         L.length
           ? L.map((p) => {
               const c = inv.counts[p.id],
                 d = c !== undefined && c !== "" ? +c - p.qty : null;
               return `<div class="card"><div class="row"><div><b>${esc(p.name)}</b><br><span class="muted">Sistema: ${num(p.qty)} ${esc(p.unit)}</span>${d !== null && d !== 0 ? `<br><span class="badge ${d < 0 ? "r" : "a"}">Diferença ${d > 0 ? "+" : ""}${num(d)}</span>` : d === 0 ? '<br><span class="badge">Confere</span>' : ""}</div><input id="ic_${p.id}" type="number" step="any" min="0" placeholder="Contado" style="max-width:110px" value="${c ?? ""}" onchange="inv.counts['${p.id}']=this.value;render()"></div></div>`;
             }).join("")
           : emptyBox("📋", "Nenhum produto nessa categoria.")
       }
       <button class="btn full" onclick="invConfirm()" ${Object.keys(inv.counts).length ? "" : 'disabled style="opacity:.5"'}>Confirmar contagem${diffs.length ? " (" + diffs.length + " divergência(s))" : ""}</button>
       <h2>Inventários anteriores</h2>${
         db.invs.length
           ? [...db.invs]
               .reverse()
               .map(
                 (i) =>
                   `<div class="card"><b>${dt(i.ts)}</b> · ${esc(i.user)}<br><span class="muted">${esc(i.cat || "Todos")} · ${i.counted} contados · ${i.diffs.length} divergência(s)</span></div>`,
               )
               .join("")
           : '<p class="muted">Nenhum inventário feito.</p>'
       }`;
      };
      function invConfirm() {
        if (rwBlock()) return;
        const L = db.products.filter(
          (p) =>
            p.active &&
            (!inv.cat || p.category === inv.cat) &&
            inv.counts[p.id] !== undefined &&
            inv.counts[p.id] !== "",
        );
        if (!L.length) {
          toast("Informe a quantidade contada de pelo menos um produto.", 1);
          return;
        }
        const diffs = L.filter((p) => +inv.counts[p.id] !== p.qty);
        if (
          !confirm(
            diffs.length
              ? "Gerar " +
                  diffs.length +
                  " ajuste(s) de estoque com as diferenças encontradas?"
              : "Nenhuma diferença. Registrar a conferência?",
          )
        )
          return;
        try {
          tx(() => {
            const rec = {
              id: uid(),
              ts: Date.now(),
              user: curUser().name,
              cat: inv.cat,
              counted: L.length,
              diffs: [],
            };
            L.forEach((p) => {
              const q = +inv.counts[p.id];
              if (q !== p.qty) {
                rec.diffs.push({ pid: p.id, name: p.name, sys: p.qty, cnt: q });
                _apply({
                  pid: p.id,
                  type: "ajuste",
                  total: true,
                  qty: q,
                  reason: "Inventário",
                  note:
                    "Divergência: sistema " +
                    num(p.qty) +
                    ", contado " +
                    num(q),
                });
              }
            });
            db.invs.push(rec);
            aud(
              "Inventário",
              L.length + " contados, " + rec.diffs.length + " divergência(s)",
            );
          });
        } catch (e) {
          toast(e.message, 1);
          return;
        }

        render();
        toast("Inventário registrado.");

      /* ---------- relatórios ---------- */
      const REPS = {
        posicao: "Posição atual do estoque",
        baixo: "Produtos com estoque baixo",
        zero: "Produtos sem estoque",
        mov: "Histórico de entradas e saídas",
        lotes: "Lotes e validades",
        perdas: "Perdas e avarias",
        valor: "Valoração do estoque (custo)",
        margem: "Margem por produto",
        top: "Mais movimentados",
        parados: "Sem movimentação",
        diverg: "Divergências de inventário",
        vendas: "Vendas do PDV",
        caixas: "Fechamentos de caixa",
        abc: "Curva ABC (últimos 90 dias)",
        cobertura: "Cobertura de estoque (dias)",
        fiscal_notas: "Notas fiscais emitidas",
        fiscal_pend: "Produtos sem dados fiscais",
      };
      const REPLVL = {
        posicao: "b",
        baixo: "b",
        zero: "b",
        abc: "analise",
        cobertura: "analise",
        fiscal_notas: "fiscal",
        fiscal_pend: "fiscal",
      };
      const repOk = (k) => {
        const l = REPLVL[k] || "relrel";
        return l === "b" || (l === "farma" ? pharmaOn() : hasFeat(l));
      };
      function reportData() {
        const f = rf,
          from = f.from ? new Date(f.from + "T00:00:00").getTime() : 0,
          to = f.to ? new Date(f.to + "T23:59:59").getTime() : Infinity;
        const inP = (m) => m.ts >= from && m.ts <= to,
          prods = db.products.filter((p) => !f.cat || p.category === f.cat);
        const nm = (id) =>
          (db.products.find((p) => p.id === id) || { name: "(removido)" }).name;
        switch (f.kind) {
          case "posicao":
            return {
              h: [
                "Produto",
                "Categoria",
                "Saldo",
                "Un.",
                "Mínimo",
                "Local",
                "Status",
              ],
              r: prods
                .filter((p) => p.active)
                .map((p) => [
                  p.name,
                  p.category,
                  p.qty,
                  p.unit,
                  p.min,
                  locsText(p),
                  { zero: "Sem estoque", low: "Baixo", ok: "OK" }[stState(p)],
                ]),
            };
          case "mov":
            return {
              h: [
                "Data",
                "Produto",
                "Tipo",
                "Anterior",
                "Movimentado",
                "Posterior",
                "Lotes",
                "Motivo",
                "Usuário",
              ],
              r: db.movements
                .filter(
                  (m) =>
                    inP(m) &&
                    (!f.type || m.type === f.type) &&
                    prods.some((p) => p.id === m.pid),
                )
                .map((m) => [
                  dt(m.ts),
                  nm(m.pid),
                  TYPES[m.type].s,
                  m.before,
                  m.delta,
                  m.after,
                  (m.lots || [])
                    .map(
                      (l) =>
                        l.lot +
                        " (" +
                        num(l.qty) +
                        (l.loc && db.locs.length > 1 ? " em " + l.loc : "") +
                        ")",
                    )
                    .join("; "),
                  m.reason,
                  m.user,
                ]),
            };
          case "baixo":
            return {
              h: ["Produto", "Saldo", "Mínimo", "Un."],
              r: prods
                .filter((p) => p.active && stState(p) === "low")
                .map((p) => [p.name, p.qty, p.min, p.unit]),
            };
          case "zero":
            return {
              h: ["Produto", "Categoria", "Última movimentação"],
              r: prods
                .filter((p) => p.active && stState(p) === "zero")
                .map((p) => [
                  p.name,
                  p.category,
                  lastMove(p.id) ? dt(lastMove(p.id)) : "-",
                ]),
            };
          case "lotes": {
            const r = [];
            prods
              .filter((p) => p.active)
              .forEach((p) =>
                (p.batches || []).forEach((b) => r.push({ p, b, d: bDays(b) })),
              );
            r.sort((a, b) => (a.d === null) - (b.d === null) || a.d - b.d);
            return {
              h: [
                "Produto",
                "Lote",
                "Local",
                "Validade",
                "Dias para vencer",
                "Saldo do lote",
                "Situação",
              ],
              r: r.map(({ p, b, d }) => [
                p.name,
                b.lot || "-",
                b.loc || "-",
                b.expiry ? dd(b.expiry + "T12:00") : "-",
                d === null ? "-" : d,
                b.qty,
                b.hold
                  ? "Bloqueado: " + b.hold.reason
                  : d !== null && d < 0
                    ? "Vencido"
                    : "Liberado",
              ]),
            };
          }
          case "perdas":
            return {
              h: [
                "Data",
                "Produto",
                "Tipo",
                "Quantidade",
                "Valor (custo)",
                "Motivo",
                "Usuário",
              ],
              r: db.movements
                .filter(
                  (m) =>
                    inP(m) &&
                    ["perda", "vencimento"].includes(m.type) &&
                    prods.some((p) => p.id === m.pid),
                )
                .map((m) => [
                  dt(m.ts),
                  nm(m.pid),
                  TYPES[m.type].s,
                  -m.delta,
                  brl(
                    -m.delta *
                      (db.products.find((p) => p.id === m.pid) || { cost: 0 })
                        .cost,
                  ),
                  m.reason,
                  m.user,
                ]),
            };
          case "valor": {
            const r = prods
              .filter((p) => p.active)
              .map((p) => [p.name, p.qty, brl(p.cost), brl(p.qty * p.cost)]);
            r.push([
              "TOTAL",
              "",
              "",
              brl(
                prods
                  .filter((p) => p.active)
                  .reduce((a, p) => a + p.qty * p.cost, 0),
              ),
            ]);
            return { h: ["Produto", "Saldo", "Custo unit.", "Valor"], r };
          }
          case "margem":
            return {
              h: [
                "Produto",
                "Custo",
                "Preço de venda",
                "Margem (R$)",
                "Margem (%)",
              ],
              r: prods
                .filter((p) => p.active && p.price)
                .map((p) => [
                  p.name,
                  brl(p.cost),
                  brl(p.price),
                  brl(p.price - p.cost),
                  Math.round(((p.price - p.cost) / p.price) * 100) + "%",
                ]),
            };
          case "top": {
            const c = {};
            db.movements.filter(inP).forEach((m) => {
              c[m.pid] = (c[m.pid] || 0) + Math.abs(m.delta);
            });
            return {
              h: ["Produto", "Volume movimentado"],
              r: Object.entries(c)
                .filter(([id]) => prods.some((p) => p.id === id))
                .sort((a, b) => b[1] - a[1])
                .slice(0, 20)
                .map(([id, v]) => [nm(id), v]),
            };
          }
          case "parados":
            return {
              h: ["Produto", "Saldo", "Última movimentação"],
              r: prods
                .filter(
                  (p) =>
                    p.active &&
                    Date.now() - (lastMove(p.id) || 0) >
                      db.settings.idleDays * DAY,
                )
                .map((p) => [
                  p.name,
                  p.qty,
                  lastMove(p.id) ? dt(lastMove(p.id)) : "nunca",
                ]),
            };
          case "diverg":
            return {
              h: [
                "Data",
                "Responsável",
                "Produto",
                "Sistema",
                "Contado",
                "Diferença",
              ],
              r: db.invs
                .filter((i) => i.ts >= from && i.ts <= to)
                .flatMap((i) =>
                  i.diffs.map((d) => [
                    dt(i.ts),
                    i.user,
                    d.name,
                    d.sys,
                    d.cnt,
                    d.cnt - d.sys,
                  ]),
                ),
            };
          case "vendas":
            return {
              h: [
                "Nº",
                "Data",
                "Itens",
                "Pagamento",
                "Total",
                "Status",
                "Usuário",
              ],
              r: db.sales

                "Chave de acesso",
                "Destinatário",
                "Valor",
                "Status",
                "Ambiente",
              ],
              r: db.fiscal.docs
                .filter((x) => x.ts >= from && x.ts <= to)
                .map((x) => [
                  dt(x.ts),
                  KIND[x.kind],
                  x.numero || "-",
                  x.serie || "-",
                  x.chave || "-",
                  x.kind === "nfe" ? x.draft.dest.nome : x.cpf || "consumidor",

                  (FST[x.status] || [x.status])[0],
                  x.simulated ? "simulado" : x.amb,
                ]),
            };
          case "fiscal_pend":
            return {
              h: ["Produto", "NCM", "CFOP", "CST/CSOSN", "Origem"],
              r: prods
                .filter(
                  (p) =>
                    p.active &&
                    (() => {
                      const f = prodFiscal(p);
                      return !validNCM(f.ncm) || !f.cfop || !f.icms;
                    })(),
                )
                .map((p) => {
                  const f = prodFiscal(p);
                  return [
                    p.name,
                    f.ncm || "FALTA",
                    f.cfop || "FALTA",
                    f.icms || "FALTA",
                    f.origem === "" ? "FALTA" : f.origem,
                  ];
                }),
            };
          case "caixas":
            return {
              h: [
                "Aberto em",
                "Fechado em",
                "Operador",
                "Troco inicial",
                "Vendas",
                "Esperado (dinheiro)",
                "Contado",
                "Diferença",
              ],
              r: (db.caixas || [])
                .filter((c) => c.openedAt >= from && c.openedAt <= to)
                .map((c) => [
                  dt(c.openedAt),
                  c.closedAt ? dt(c.closedAt) : "aberto",
                  c.openedBy,
                  brl(c.initial),
                  c.closedAt ? brl(c.total) : "-",
                  c.closedAt ? brl(c.expected) : "-",
                  c.closedAt ? brl(c.counted) : "-",
                  c.closedAt ? brl(c.diff) : "-",
                ]),
            };
          case "abc": {
            const lim90 = Date.now() - 90 * DAY,
              v = {};
            db.movements
              .filter((m) => m.ts >= lim90 && m.type === "saida")
              .forEach((m) => {
                const p = db.products.find((x) => x.id === m.pid);
                if (p && prods.includes(p))
                  v[p.id] =
                    (v[p.id] || 0) + -m.delta * (p.price || p.cost || 0);
              });
            const arr = Object.entries(v).sort((a, b) => b[1] - a[1]),
              tot = arr.reduce((a, x) => a + x[1], 0) || 1;

              h: ["Produto", "Valor saído (90 dias)", "% acumulado", "Classe"],

                  nm(id),
                  brl(x),
                  Math.round(pc) + "%",
                  pc - (x / tot) * 100 < 80
                    ? "A"
                    : pc - (x / tot) * 100 < 95
                      ? "B"
                      : "C",

            };

      /* ---------- emissão (assíncrona, fora da venda: a venda nunca fica presa) ---------- */

          const errs = validateFiscal(doc.kind, built.payload, S);

            await saveFiscalResult(
              id,
              {
                status: "erro_autorizacao",

            id,

            };

            mensagem_sefaz:

      async function saveFiscalToken() {

      /* ---------- lista e detalhe das notas ---------- */
      let fq = "todas";

        const F = db.fiscal,
          S = F.settings,

          adm = can("fiscal");

        if (fq === "nfce") L = L.filter((d) => d.kind === "nfce");
        if (fq === "nfe") L = L.filter((d) => d.kind === "nfe");
        if (fq === "prob")
          L = L.filter((d) =>
            [
              "erro_autorizacao",
              "pendente",
              "processando_autorizacao",
              "denegado",
            ].includes(d.status),
          );
        const prob = F.docs.filter((d) =>

       ${miss.length ? `<div class="alert r" onclick="${adm ? "go('fiscalcfg')" : ""}"><span>Complete a configuração fiscal para emitir: ${miss.join(", ")}. ${adm ? "Toque para configurar." : "Peça a um administrador."}</span></div>` : ""}
       ${prob ? `<div class="alert a" onclick="fq='prob';render()"><span>${prob} nota(s) precisam de atenção (rejeitadas ou aguardando envio).</span></div>` : ""}
       ${adm ? `<div class="row"><button class="btn" onclick="openNfe()" ${miss.length ? 'disabled style="opacity:.5"' : ""}>➕ Nova NF-e</button><button class="btn ghost" onclick="go('fiscalcfg')">🛠️ Configurar</button></div>` : ""}

       ${L.length ? L.map(docItem).join("") : emptyBox("🧾", "Nenhuma nota emitida ainda.", "NFC-e sai das vendas do PDV. NF-e você emite aqui, para clientes com CPF ou CNPJ.")}`;
      };
      function docItem(d) {
        const st = FST[d.status] || [d.status, ""],
          sale = d.saleId ? db.sales.find((s) => s.id === d.saleId) : null;

      }
      function fmtChave(c) {
        return String(c || "").replace(/(\d{4})(?=\d)/g, "$1 ");
      }
      function cancelLeft(d) {
        return d.authAt
          ? Math.max(0, CANCEL_MS[d.kind] - (Date.now() - d.authAt))
          : 0;
      }
      function docDetail(id) {
        const d = docById(id);
        if (!d) return;
        window._docOpen = id;
        const st = FST[d.status] || [d.status, ""],
          adm = can("fiscal") || can("pdv"),
          left = cancelLeft(d);
        const fmtLeft = (ms) =>
          ms >= 3600e3
            ? Math.floor(ms / 3600e3) +
              " h " +
              Math.floor((ms % 3600e3) / 60e3) +
              " min"
            : Math.max(1, Math.ceil(ms / 60e3)) + " min";
        modal(`<h1>${KIND[d.kind]}${d.numero ? " nº " + d.numero : ""}</h1>
       <div class="card"><span class="badge ${st[1]}">${st[0]}</span> ${d.simulated ? '<span class="badge a">SIMULADA</span>' : d.amb === "homologacao" ? '<span class="badge a">HOMOLOGAÇÃO</span>' : ""}<br><br>
       Valor: <b>${brl(d.total)}</b><br><span class="muted">${dt(d.ts)} · ${esc(d.user || "")}${d.serie ? " · série " + d.serie : ""}</span>
       ${d.chave ? `<hr style="border:0;border-top:1px solid var(--bd)"><span class="muted">Chave de acesso</span><br><b style="word-break:break-all;font-size:13px">${fmtChave(d.chave)}</b>` : ""}
       ${d.msg ? `<hr style="border:0;border-top:1px solid var(--bd)"><span class="muted">Retorno</span><br>${esc(d.msg)}${d.sefaz ? ' <span class="muted">(código ' + esc(d.sefaz) + ")</span>" : ""}` : ""}
       ${(d.erros || []).length > 1 ? `<br><br><b>O que corrigir:</b><ul style="margin:6px 0;padding-left:18px">${d.erros.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
       ${d.cancel ? `<hr style="border:0;border-top:1px solid var(--bd)"><span class="muted">Cancelada em ${dt(d.cancel.ts)}</span><br>Justificativa: ${esc(d.cancel.just)}${d.cancel.protocolo ? '<br><span class="muted">Protocolo ' + esc(d.cancel.protocolo) + "</span>" : ""}` : ""}
       ${(d.ccs || []).length ? `<hr style="border:0;border-top:1px solid var(--bd)"><b>Cartas de correção</b>${d.ccs.map((c) => `<br><span class="muted">${dt(c.ts)} · nº ${c.n}</span> ${esc(c.text)}`).join("")}` : ""}</div>
       <div class="row noprint">${d.status === "autorizado" || d.status === "cancelado" ? `<button class="btn ghost" onclick="printDoc('${id}')">🖨️ ${d.kind === "nfce" ? "Cupom" : "DANFE"}</button>` : ""}${d.xmlUrl && !d.simulated ? `<button class="btn ghost" onclick="window.open('${esc(d.xmlUrl)}','_blank')">⬇️ XML</button>` : ""}${d.chave && !d.simulated ? `<button class="btn ghost" onclick="navigator.clipboard&&navigator.clipboard.writeText('${d.chave}');toast('Chave copiada.')">Copiar chave</button>` : ""}</div><br>
       ${adm && ["erro_autorizacao", "pendente"].includes(d.status) ? `<button class="btn full" onclick="retryDoc('${id}')">🔁 ${d.status === "pendente" ? "Enviar agora" : "Corrigi, reenviar"}</button><br><br>` : ""}
       ${adm && d.status === "processando_autorizacao" ? `<button class="btn ghost full" onclick="refreshDoc('${id}')">Atualizar situação</button><br><br>` : ""}
       ${adm && d.status === "autorizado" && left > 0 ? `<button class="btn red full" onclick="cancelModal('${id}')">Cancelar nota (prazo: mais ${fmtLeft(left)})</button><br><br>` : ""}
       ${d.status === "autorizado" && left <= 0 ? `<p class="muted">O prazo padrão de cancelamento terminou (NFC-e: 30 minutos; NF-e: 24 horas; alguns estados permitem mais). Para desfazer, fale com seu contador sobre nota de devolução ou evento específico.</p>` : ""}
       ${d.kind === "nfe" && d.status === "autorizado" && can("fiscal") ? `<button class="btn ghost full" onclick="cceModal('${id}')">✍️ Carta de correção</button><br><br>` : ""}
       ${d.kind === "nfe" && d.status === "erro_autorizacao" && can("fiscal") && !d.discarded ? `<button class="btn ghost full" onclick="discardNfe('${id}')">Descartar nota e devolver itens ao estoque</button><br><br>` : ""}
       <button class="btn ghost full" onclick="window._docOpen=null;closeModal()">Fechar</button>`);
      }
      function retryDoc(id) {
        if (rwBlock()) return;
        closeModal();
        emitDoc(id).then(() => {
          const d = docById(id);
          if (d)
            toast(
              d.status === "autorizado"
                ? "Nota autorizada."
                : (FST[d.status] || [d.status])[0] + ": " + (d.msg || ""),
              d.status !== "autorizado",
            );
        });
      }
      async function refreshDoc(id) {
        load();
        const d = docById(id);
        try {
          const r = await callProvider("status", d, null);
          await saveFiscalResult(id, r, null);
        } catch (e) {
          toast("Não consegui consultar agora: " + e.message, 1);
        }
      }

      /* ---------- cancelamento e carta de correção ---------- */
      function cancelModal(id) {
        const d = docById(id),
          sale = d.saleId && db.sales.find((s) => s.id === d.saleId);
        modal(`<h1>Cancelar ${KIND[d.kind]}${d.numero ? " nº " + d.numero : ""}</h1><p class="muted">O cancelamento é registrado na SEFAZ e não pode ser desfeito.</p><label>Justificativa (15 a 255 caracteres)</label><textarea id="cn_j" rows="3" placeholder="Ex.: Venda cancelada a pedido do cliente"></textarea>
       ${sale && sale.status === "ok" ? `<label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--tx)"><input type="checkbox" id="cn_rev" style="width:20px;min-height:20px" checked> Estornar também a venda #${sale.n} e devolver os itens ao estoque</label>` : ""}
       ${d.kind === "nfe" && d.draft && d.draft.baixa && !d.stockReturned ? `<label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--tx)"><input type="checkbox" id="cn_rev" style="width:20px;min-height:20px" checked> Devolver os itens ao estoque</label>` : ""}
       <br><button class="btn red full" onclick="doCancel('${id}')">Confirmar cancelamento</button><br><br><button class="btn ghost full" onclick="docDetail('${id}')">Voltar</button>`);
      }
      async function doCancel(id) {
        if (rwBlock()) return;
        const just = $("#cn_j").value.trim(),
          rev = $("#cn_rev") && $("#cn_rev").checked;
        if (just.length < 15 || just.length > 255) {
          toast("A justificativa precisa ter entre 15 e 255 caracteres.", 1);
          return;
        }
        load();
        const d = docById(id);
        let r;
        try {
          r = await callProvider("cancel", d, null, { justificativa: just });
        } catch (e) {
          toast(
            "Sem conexão com o emissor. Nada foi cancelado; tente de novo.",
            1,
          );
          return;
        }
        if (r.status !== "cancelado") {
          toast(
            "Não foi possível cancelar: " +
              (r.mensagem_sefaz || "o emissor recusou") +
              ".",
            1,
          );
          return;
        }
        try {
          tx(() => {
            const x = docById(id);
            x.status = "cancelado";
            x.cancel = {
              ts: Date.now(),
              just,
              protocolo: r.numero_protocolo || "",
              user: curUser().name,
            };
            x.msg = r.mensagem_sefaz || "";
            if (rev) {
              if (x.saleId) {
                const s = db.sales.find((y) => y.id === x.saleId);
                if (s && s.status === "ok") reverseSale(s);
              } else if (x.draft && x.draft.baixa && !x.stockReturned)
                returnNfeStock(x, "Cancelamento NF-e");
            }
            aud(
              KIND[x.kind] + " cancelada",
              (x.numero || "-") + " · " + just.slice(0, 60),
            );
          });
        } catch (e) {
          toast(
            "A nota foi cancelada no emissor, mas não consegui atualizar o estoque: " +
              e.message,
            1,
          );
        }
        closeModal();
        render();
        toast("Nota cancelada.");
      }
      function cceModal(id) {
        modal(
          `<h1>Carta de correção</h1><p class="muted">Serve para corrigir dados que não alteram valores, impostos, destinatário nem datas. Até 20 cartas por nota; vale a última.</p><label>Texto da correção (15 a 1000 caracteres)</label><textarea id="cc_t" rows="4"></textarea><br><button class="btn full" onclick="doCce('${id}')">Enviar carta de correção</button><br><br><button class="btn ghost full" onclick="docDetail('${id}')">Voltar</button>`,

          return;

        if ((d.ccs || []).length >= 20) {
          toast("Limite de 20 cartas de correção por nota.", 1);

        if (r.status !== "autorizado") {
          toast(

      /* ---------- estorno de venda (usado pelo PDV e pelo cancelamento) ---------- */
      function reverseSale(s) {
        if (s.status !== "ok") throw Error("Venda já estornada.");
        s.items.forEach((i) => {
          if (db.products.find((p) => p.id === i.pid))
            _apply({
              pid: i.pid,
              type: "devolucao",
              qty: i.qty,
              reason: "Estorno venda PDV #" + s.n,
              ref: "PDV#" + s.n,
              restore: i.lots,
            });
        });
        if (typeof custReverse === "function") custReverse(s);
        s.status = "estornada";
        aud("Venda estornada", "#" + s.n + " · " + brl(s.total));
      }
      function returnNfeStock(d, why) {
        d.draft.items.forEach((i) => {
          if (db.products.find((p) => p.id === i.pid))
            _apply({
              pid: i.pid,
              type: "devolucao",
              qty: i.qty,
              reason: why,
              ref: d.ref,
            });
        });
        d.stockReturned = true;
      }

       ${nd.items.map((i, k) => `<div class="cartline" style="flex-wrap:wrap"><div class="t"><b>${esc(i.name)}</b><small class="muted">${esc(i.unit)}</small></div><input style="width:76px" type="number" step="any" min="0" value="${i.qty}" onchange="nd.items[${k}].qty=+this.value;renderNfe([])"><input style="width:96px" type="number" step="any" min="0" value="${i.price}" onchange="nd.items[${k}].price=+this.value;renderNfe([])"><button class="btn ghost sm fit" onclick="nd.items.splice(${k},1);renderNfe([])">✕</button></div>`).join("")}

      /* ================= GIRO — camada SaaS ================= */
      /* ---------- cobrança (lógica pura; o provedor real chama o webhook no back-end) ---------- */
      function couponOf(code) {
        const c = (PLAT.coupons || []).find(
          (x) =>
            x.active &&
            x.code.toLowerCase() ===
              String(code || "")
                .trim()
                .toLowerCase(),
        );
        return c || null;
      }
      const addonSet = (a, c) =>
        [
          ...new Set(
            (a === undefined ? (c || CO).sub.addons || [] : a).filter(
              (k) => AD()[k],
            ),
          ),
        ].sort();
      const qKey = (pk, cycle, code, ad) =>
        pk + "|" + cycle + "|" + (code || "") + "|" + addonSet(ad).join(",");
      function priceFor(pk, cycle, code, ad) {
        if (SV.on && SV.q && SV.q.key === qKey(pk, cycle, code, ad))
          return {
            base: SV.q.base,
            coupon: SV.q.coupon,
            total: SV.q.total,
            credit: SV.q.credit || 0,
          };
        const p = PL()[pk],
          free = PLAT.settings.annualMonthsFree,
          m = cycle === "anual" ? 12 - free : 1,
          base =
            Math.round(
              (p.price + addonSet(ad).reduce((a, k) => a + AD()[k].price, 0)) *
                m *
                100,
            ) / 100,
          c = couponOf(code);
        return {
          base,
          coupon: c,
          total: Math.round(base * (1 - (c ? c.pct : 0) / 100) * 100) / 100,
        };
      }
      function usageOf(cid) {
        if (SV.on && SV.platOk && SV.usage[cid]) return SV.usage[cid];
        let d = null;
        try {
          d = JSON.parse(localStorage.getItem("giro_db_" + cid));
        } catch (e) {}
        return d
          ? {
              products: d.products.length,
              users: d.users.length,
              locs: d.locs.length,
              movs: d.movements.length,
              sales: d.sales.length,
            }
          : { products: 0, users: 1, locs: 1, movs: 0, sales: 0 };
      }
      function planFits(pk, cid) {
        const u = usageOf(cid),
          p = PL()[pk],
          miss = [];
        if (u.products > p.products)
          miss.push(
            "produtos (" +
              u.products +
              " cadastrados, o plano permite " +
              p.products +
              ")",
          );
        if (u.users > p.users)
          miss.push(
            "usuários (" + u.users + ", o plano permite " + p.users + ")",
          );
        if (u.locs > (p.flags.multi ? p.locs : 1))
          miss.push(
            "locais de estoque (" +
              u.locs +

      function billPayOk(c, pk, cycle, code, ad) {
        const now = Date.now(),
          pr = priceFor(pk, cycle, code, ad),
          days = cycle === "anual" ? 365 : 30,
          s = c.sub;
        const start =
          s.status === "active" && s.periodEnd > now && s.plan === pk
            ? s.periodEnd
            : now;
        Object.assign(s, {
          plan: pk,
          cycle,
          addons: addonSet(ad, c),
          status: "active",
          periodEnd: start + days * DAY,
          graceUntil: 0,
        });
        c.suspended = false;
        c.invoices = c.invoices || [];
        c.invoices.push({
          id: uid(),
          ts: now,
          plan: pk,
          cycle,
          addons: JSON.stringify(addonSet(ad, c)),
          amount: pr.total,
          status: "paga",
        });
        return pr;
      }
      function billPayFail(c) {
        const now = Date.now(),
          s = c.sub;
        c.invoices = c.invoices || [];
        c.invoices.push({
          id: uid(),
          ts: now,
          plan: s.plan,
          cycle: s.cycle,
          amount: priceFor(s.plan, s.cycle || "mensal").total,
          status: "recusada",
        });
        if (s.status === "active" || s.status === "past_due") {
          s.status = "past_due";
          s.graceUntil =
            Math.max(s.periodEnd || 0, now) + PLAT.settings.graceDays * DAY;
        }
      }
      function billCancel(c) {
        if (c.sub.status === "active" || c.sub.status === "past_due") {
          c.sub.status = "canceled";
          if (!c.sub.periodEnd || c.sub.periodEnd < Date.now())
            c.sub.periodEnd = Date.now();
        } else if (c.sub.status === "trial") {
          c.sub.status = "canceled";
          c.sub.periodEnd = c.sub.trialEnds;
        }
      }

      }
      function rxValidate(X, need, now) {
        const f = farmaCfg(),
          ctl = need.some((p) => farmaOf(p).cls === "controlado"),
          ret = need.some(isRetained),
          E = [];
        if (!f.rt.nome)
          E.push("Cadastre o farmacêutico responsável em Configurações.");
        if (!X.pn) E.push("Informe o nome do paciente.");
        const pd = onlyDigits(X.pd);
        if ((ctl || ret) && !pd) E.push("Informe o CPF do paciente.");
        if (pd && !validCPF(pd)) E.push("CPF do paciente inválido.");
        if (!X.same && (!X.cn || !X.cd))
          E.push("Informe nome e documento do comprador.");
        if (!X.prn) E.push("Informe o nome do prescritor.");
        if (!X.prnum) E.push("Informe o número do conselho do prescritor.");
        if (!/^[A-Za-z]{2}$/.test(X.pruf || ""))
          E.push("Informe a UF do conselho com 2 letras.");
        if (!X.dt) E.push("Informe a data da receita.");
        else {
          const nd = new Date(now || Date.now()),
            t0 = Date.UTC(nd.getFullYear(), nd.getMonth(), nd.getDate()),
            [yy, mm, dd] = X.dt.split("-").map(Number),
            days = Math.round((t0 - Date.UTC(yy, mm - 1, dd)) / DAY); // dias de calendário, não depende da hora
          if (days < 0) E.push("A data da receita está no futuro.");
          else
            need.forEach((p) => {

                lim = (f.rxDias || {})[c];

                    " dia(s): " +

                    " vale " +

                    '"). Confira com o responsável técnico.',
                );
            });

          E.push(
            "Informe o número da receita ou da notificação do controlado.",
          );

          ? null
          : {
              pids: need.map((p) => p.id),
              pac: { nome: X.pn, doc: pd },
              comp: X.same ? {} : { nome: X.cn, doc: X.cd, tel: X.ct || "" },

      /* ---------- entrada de mercadoria pelo XML da NF-e de compra ---------- */
      // Lê o XML que o fornecedor envia (modelo 55), confere com o estoque e dá a entrada de tudo de uma vez.
      // Não consulta a SEFAZ: confere o protocolo gravado no próprio XML e a chave de acesso, mas não prova que a nota existe.
      function xmlParse(src) {
        src = String(src).replace(/^﻿/, "");
        src = src.replace(new RegExp("<" + "\\?[\\s\\S]*?\\?>", "g"), "");
        src = src.replace(
          new RegExp("<" + "!--" + "[\\s\\S]*?--" + ">", "g"),
          "",
        );
        src = src.replace(
          new RegExp(String.fromCharCode(60, 33) + "DOCTYPE[^>]*>", "gi"),
          "",
        );
        const dec = (s) =>
          s.replace(/&(lt|gt|amp|quot|apos|#\d+|#x[0-9a-fA-F]+);/g, (m, e) =>
            e === "lt"
              ? "<"
              : e === "gt"
                ? ">"
                : e === "amp"
                  ? "&"
                  : e === "quot"
                    ? '"'
                    : e === "apos"
                      ? "'"
                      : e[1] === "x"
                        ? String.fromCodePoint(parseInt(e.slice(2), 16))
                        : String.fromCodePoint(+e.slice(1)),
          );
        const root = { n: "#", a: {}, c: [], t: "" },
          st = [root];
        const re =
          /<!\[CDATA\[([\s\S]*?)\]\]>|<(\/?)([A-Za-z_][\w:.-]*)((?:\s+[\w:.-]+\s*=\s*(?:"[^"]*"|'[^']*'))*)\s*(\/?)>|([^<]+)/g;
        let m;
        while ((m = re.exec(src))) {
          if (m[1] !== undefined) {
            st[st.length - 1].t += m[1];
            continue;
          }
          if (m[6] !== undefined) {
            st[st.length - 1].t += dec(m[6]);
            continue;
          }
          const name = m[3].replace(/^.*:/, "");
          if (m[2]) {
            if (st.length < 2 || st[st.length - 1].n !== name)
              throw Error("XML inválido: tag </" + name + "> fora de lugar.");
            st.pop();
            continue;
          }
          const a = {};
          String(m[4] || "").replace(
            /([\w:.-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g,
            (x, k, v1, v2) => {
              a[k.replace(/^.*:/, "")] = dec(v1 !== undefined ? v1 : v2);
            },
          );
          const nd = { n: name, a, c: [], t: "" };
          st[st.length - 1].c.push(nd);
          if (!m[5]) {
            st.push(nd);
            if (st.length > 60) throw Error("XML inválido: muitos níveis.");
          }
        }
        if (st.length !== 1) throw Error("XML inválido: arquivo incompleto.");
        return root;
      }
      const xk = (nd, name) => (nd ? nd.c.find((x) => x.n === name) : null);
      const xs = (nd, path) => {
        let c = nd;
        for (const p of path.split("/")) {
          c = xk(c, p);
          if (!c) return "";
        }
        return String(c.t || "").trim();
      };
      const xn = (nd, path) => {
        const v = parseFloat(xs(nd, path));
        return isNaN(v) ? 0 : v;
      };
      function xfind(nd, name) {
        if (!nd) return null;
        if (nd.n === name) return nd;
        for (const c of nd.c) {
          const r = xfind(c, name);
          if (r) return r;
        }
        return null;
      }
      function chaveOk(k) {
        if (!/^\d{44}$/.test(k)) return false;
        let s = 0,
          w = 2;
        for (let i = 42; i >= 0; i--) {
          s += +k[i] * w;
          w = w === 9 ? 2 : w + 1;
        }
        const r = s % 11,
          dv = r < 2 ? 0 : 11 - r;
        return dv === +k[43];
      }
      const fmtDoc = (d) =>
        d.length === 14
          ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5")
          : d.length === 11
            ? d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4")
            : d;
      function nfeRead(text) {
        let root;
        try {
          root = xmlParse(text);
        } catch (e) {
          return { erro: e.message };
        }
        const inf = xfind(root, "infNFe");
        if (!inf)
          return {
            erro: "Este arquivo não é o XML de uma NF-e. Use o arquivo .xml que o fornecedor enviou (não o PDF da DANFE).",
          };
        const ide = xk(inf, "ide"),
          mod = xs(inf, "ide/mod"),
          emit = xk(inf, "emit"),
          dest = xk(inf, "dest");
        if (mod && mod !== "55")
          return {
            erro:
              "Este XML é do modelo " +
              mod +
              (mod === "65" ? " (NFC-e, cupom de consumidor)" : "") +
              ". Para entrada de compra use a NF-e, modelo 55.",
          };
        const prot = xfind(root, "infProt"),
          cStat = prot ? xs(prot, "cStat") : "",
          avisos = [];
        const chave =
          String(inf.a.Id || "").replace(/^NFe/, "") ||
          (prot ? xs(prot, "chNFe") : "");
        if (!/^\d{44}$/.test(chave))
          return {
            erro: "A chave de acesso da nota não foi encontrada ou está incompleta.",
          };
        if (!chaveOk(chave))
          avisos.push(
            "O dígito verificador da chave de acesso não confere. Confira se o arquivo não foi alterado.",
          );
        if (!prot)
          avisos.push(
            "O XML não traz o protocolo de autorização da SEFAZ. Confira a nota com o fornecedor antes de dar entrada.",
          );
        else if (!["100", "150"].includes(cStat))
          return {
            erro:
              "A SEFAZ não autorizou esta nota (situação " +
              cStat +
              ": " +
              xs(prot, "xMotivo") +
              "). Não dá para dar entrada.",
          };
        const fin = xs(inf, "ide/finNFe");
        if (fin === "2" || fin === "3")
          return {
            erro: "Esta é uma nota complementar ou de ajuste: ela não traz mercadoria nova.",
          };
        if (fin === "4")
          return {
            erro: "Esta é uma nota de devolução. Registre como devolução ou ajuste, não como compra.",
          };
        if (xs(inf, "ide/tpNF") === "0")
          avisos.push(
            "A nota está marcada como de entrada própria (emitida por você). Confira se é uma compra.",
          );
        const itens = inf.c
          .filter((x) => x.n === "det")
          .map((d, i) => {
            const p = xk(d, "prod"),
              qtd = xn(p, "qCom"),
              vProd = xn(p, "vProd"),
              vDesc = xn(p, "vDesc"),
              vFrete = xn(p, "vFrete"),
              vSeg = xn(p, "vSeg"),
              vOutro = xn(p, "vOutro");
            const g =
              String(xs(p, "cEAN")).replace(/\D/g, "") ||
              String(xs(p, "cEANTrib")).replace(/\D/g, "");
            const rastro = p.c
              .filter((x) => x.n === "rastro")
              .map((r) => ({
                lot: xs(r, "nLote"),
                exp: xs(r, "dVal"),
                fab: xs(r, "dFab"),
                qtd: xn(r, "qLote"),
              }));
            const imp = xk(d, "imposto"),
              icms = imp && xk(imp, "ICMS") ? xk(imp, "ICMS").c[0] : null;
            return {
              n: +(d.a.nItem || i + 1),
              cProd: xs(p, "cProd"),
              gtin:
                /^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(g) && !/^0+$/.test(g)
                  ? g
                  : "",
              nome: xs(p, "xProd"),
              ncm: xs(p, "NCM"),
              cest: xs(p, "CEST"),
              cfop: xs(p, "CFOP"),
              un: xs(p, "uCom"),
              qtd,
              vUn: xn(p, "vUnCom"),
              vProd,
              vDesc,
              vFrete,
              vSeg,
              vOutro,
              custoUn:
                qtd > 0
                  ? Math.round(
                      ((vProd - vDesc + vFrete + vSeg + vOutro) / qtd) * 10000,
                    ) / 10000
                  : 0,
              orig: icms ? xs(icms, "orig") : "",
              anvisa: xs(p, "med/cProdANVISA"),
              lotes: rastro
                .filter((r) => r.lot && r.qtd > 0)
                .map((r) => ({
                  lot: r.lot,
                  exp: /^\d{4}-\d{2}-\d{2}$/.test(r.exp) ? r.exp : "",
                  qtd: r.qtd,
                })),
            };
          });
        if (!itens.length) return { erro: "A nota não tem itens." };
        if (itens.some((x) => !(x.qtd > 0) || !x.nome))
          return {
            erro: "A nota tem item sem nome ou sem quantidade. Não dá para ler este arquivo.",
          };
        const em = xs(inf, "ide/dhEmi") || xs(inf, "ide/dEmi");
        return {
          nota: {
            chave,
            mod: "55",
            serie: xs(inf, "ide/serie"),
            n: xs(inf, "ide/nNF"),
            emissao: em.slice(0, 10),
            cStat,
            emit: {
              doc: xs(emit, "CNPJ") || xs(emit, "CPF"),
              nome: xs(emit, "xNome"),
              fant: xs(emit, "xFant"),
              uf: xs(emit, "enderEmit/UF"),
            },
            dest: {
              doc: xs(dest, "CNPJ") || xs(dest, "CPF"),
              nome: xs(dest, "xNome"),
            },
            vNF: xn(inf, "total/ICMSTot/vNF"),
            itens,
          },
          avisos,
        };
      }
      /* vínculo de cada item com um produto já cadastrado: EAN, código do fornecedor, código próprio e, por último, nome igual */
      function nfeMatch(it, doc) {
        const act = db.products.filter((p) => p.active);
        let p = it.gtin && act.find((x) => x.barcode === it.gtin);
        if (p) return { pid: p.id, by: "código de barras" };
        p =
          doc &&
          it.cProd &&
          act.find((x) => x.supCodes && x.supCodes[doc] === it.cProd);
        if (p) return { pid: p.id, by: "código do fornecedor" };
        p = it.cProd && act.find((x) => x.code && x.code === it.cProd);
        if (p) return { pid: p.id, by: "código do produto" };
        p = act.find((x) => norm(x.name) === norm(it.nome));
        if (p) return { pid: p.id, by: "mesmo nome" };
        return null;
      }
      const nfUnit = (u) => {
        const s = String(u || "un")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "");
        return (
          {
            un: "un",
            und: "un",
            unid: "un",
            pc: "un",
            pca: "un",
            pct: "pct",
            cx: "cx",
            kg: "kg",
            g: "g",
            l: "l",
            lt: "l",
            ml: "ml",
            m: "m",
            fd: "fd",
          }[s] ||
          s ||
          "un"
        );
      };

      function nfeValidateDraft(d) {

        L.forEach((l) => {

              "Item " +
                l.n +

            throw Error(
              "Item " +
                l.n +
                " (" +
                l.it.nome +

      /* ================= GIRO IA: análise estatística local + assistente por regras =================

      /* ---------- base de dados compartilhada (painel e IA) ---------- */
      const sod = (t) => {
        const d = new Date(t);

      };
      const dayKey = (t) => {
        const d = new Date(t);

          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")

      };
      const WD = [
          "domingo",
          "segunda-feira",
          "terça-feira",
          "quarta-feira",
          "quinta-feira",
          "sexta-feira",
          "sábado",
        ],
        WDS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
      const okSales = (from, to) =>

          (s) =>

            (from === undefined || s.ts >= from) &&
            (to === undefined || s.ts <= to),
        );
      const saleGross = (s) => s.items.reduce((a, i) => a + i.qty * i.price, 0);
      const itemRev = (s, i) => {
        const g = saleGross(s);
        return g > 0 ? i.qty * i.price * (s.total / g) : 0;
      }; // já com o desconto rateado
      const prodOf = (id) => db.products.find((p) => p.id === id);
      const itemCost = (i) => {
        const p = prodOf(i.pid);
        return i.qty * ((p && p.cost) || 0);
      };
      function histDays() {
        let m = Infinity;
        db.sales.forEach((s) => {
          if (s.status === "ok" && s.ts < m) m = s.ts;
        });
        return m === Infinity
          ? 0
          : Math.min(
              90,
              Math.max(1, Math.round((sod(Date.now()) - sod(m)) / DAY) + 1),
            );
      }
      function unitsByDay(n) {
        // {pid:[unidades por dia]} do mais antigo ao de hoje
        const t0 = sod(Date.now()) - (n - 1) * DAY,
          U = {};
        okSales(t0).forEach((s) => {
          const k = Math.min(n - 1, Math.floor((s.ts - t0) / DAY));
          s.items.forEach((i) => {
            (U[i.pid] || (U[i.pid] = Array(n).fill(0)))[k] += i.qty;
          });
        });
        return U;
      }
      function revByDay(n) {
        const t0 = sod(Date.now()) - (n - 1) * DAY,
          a = Array(n).fill(0);
        okSales(t0).forEach((s) => {
          a[Math.min(n - 1, Math.floor((s.ts - t0) / DAY))] += s.total;
        });
        return a;
      }
      const sum = (a) => a.reduce((x, y) => x + y, 0),
        mean = (a) => (a.length ? sum(a) / a.length : 0);
      const sd = (a) => {
        if (a.length < 2) return 0;
        const m = mean(a);
        return Math.sqrt(sum(a.map((x) => (x - m) ** 2)) / (a.length - 1));
      };
      function rateOf(a, H) {
        // unidades/dia: 60% últimas 2 semanas + 40% últimas 8 semanas (só conta dias com histórico)
        const n = a.length,
          w = (k) =>
            sum(a.slice(n - Math.min(k, n))) / Math.max(1, Math.min(k, H));
        return H < 1 ? 0 : 0.6 * w(14) + 0.4 * w(56);
      }
      const fmtDay = (t) =>
        new Date(t).toLocaleDateString("pt-BR", {
          day: "2-digit",
          month: "2-digit",

      const pl = (n, s, p) => num(n) + " " + (Math.abs(n) === 1 ? s : p);

      /* ---------- previsão de receita (próximos 7 dias) ---------- */
      function aiForecast() {
        const H = histDays();
        if (H < 7) return null;
        const n = Math.min(H, 56),
          R = revByDay(n),
          today = sod(Date.now()),
          days = [];
        const trend = (() => {
          const a = mean(R.slice(-14)),
            b = mean(R);
          return b > 0 ? Math.min(1.3, Math.max(0.7, a / b)) : 1;
        })();
        let tot = 0,
          vr = 0;
        for (let i = 1; i <= 7; i++) {
          const t = today + i * DAY,
            wd = new Date(t).getDay();
          const same = R.filter(
            (_, k) =>
              new Date(today - (n - 1 - k) * DAY).getDay() === wd && k < n - 1,
          ); // sem o dia de hoje, ainda incompleto
          const base = same.length ? mean(same) : mean(R),
            v = base * trend;
          days.push({ t, v, wd });
          tot += v;
          vr += (same.length > 1 ? sd(same) : sd(R)) ** 2;
        }
        const e = Math.sqrt(vr);
        return {
          days,
          total: tot,
          low: Math.max(0, tot - e),
          high: tot + e,
          trend,
          n,
        };
      }

      /* ---------- insights ---------- */
      const AI = { acts: [], log: [], cache: { k: "", v: null } };
      function aiInsights() {
        const key = [
          db.sales.length,
          db.movements.length,
          db.products.length,
          sod(Date.now()),
        ].join(":");
        if (AI.cache.k === key) return AI.cache.v;
        const out = [],
          H = histDays(),
          act = db.products.filter((p) => p.active),
          U = unitsByDay(90);
        const add = (sev, ic, t, x, impact, acts) =>
          out.push({ sev, ic, t, x, impact: impact || 0, acts: acts || [] });
        const rate = (p) => (U[p.id] ? rateOf(U[p.id], H) : 0);
        const toPid = (p) => ["Ver produto", () => prodDetail(p.id)];

        // 1) ruptura prevista e produtos zerados que vendiam
        const rup = [];
        act.forEach((p) => {
          const r = rate(p);
          if (r <= 0) return;
          const d = p.qty / r;
          if (p.qty <= 0) rup.push({ p, r, d: 0, loss: r * (p.price || 0) });
          else if (d <= 7) rup.push({ p, r, d, loss: 0 });
        });
        rup
          .sort((a, b) => a.d - b.d || b.loss - a.loss)
          .slice(0, 5)
          .forEach(({ p, r, d, loss }) => {
            const need = Math.max(1, Math.ceil(r * 30 + p.min - p.qty));
            if (p.qty <= 0)
              add(
                "r",
                "🔴",
                p.name + ": sem estoque",
                `Vendia cerca de ${num(Math.round(r * 10) / 10)} ${p.unit}/dia; cada dia parado deixa de render ~${brl(loss)}. Para 30 dias: comprar ~${num(need)} ${p.unit}.`,
                loss * 7,
                [toPid(p), ["Ver reposição", () => go("alert")]],
              );
            else
              add(
                d <= 3 ? "r" : "a",
                d <= 3 ? "🔴" : "🟠",
                p.name +
                  ": acaba em ~" +
                  Math.max(1, Math.round(d)) +
                  " dia(s)",
                `Saldo ${num(p.qty)} ${p.unit}, saindo ~${num(Math.round(r * 10) / 10)}/dia (previsão: ${fmtDay(Date.now() + d * DAY)}). Para 30 dias: comprar ~${num(need)} ${p.unit}.`,
                r * (p.price || 0) * (7 - d),
                [toPid(p), ["Ver reposição", () => go("alert")]],
              );
          });
        if (rup.length > 5)
          add(
            "a",
            "🟠",
            rup.length - 5 + " outro(s) produto(s) com ruptura prevista",
            "Veja a lista completa e gere os pedidos em Alertas e reposição.",
            0,
            [["Abrir reposição", () => go("alert")]],
          );

        // 2) lotes que não devem ser vendidos até vencer
        if (lotsOn()) {
          const risk = [];
          act.forEach((p) => {
            const r = rate(p),
              bs = (p.batches || [])
                .filter((b) => b.expiry && b.qty > 0)
                .sort((a, b) => (a.expiry < b.expiry ? -1 : 1));
            let ahead = 0;
            bs.forEach((b) => {
              const d = bDays(b);
              ahead += b.qty;
              if (d === null || d > 90) return;
              const sold = r * Math.max(0, d),
                left =
                  d < 0 ? b.qty : Math.max(0, Math.min(b.qty, ahead - sold));
              if (left >= Math.max(1, b.qty * 0.2))
                risk.push({ p, b, d, left, loss: left * (p.cost || 0) });
            });
          });
          risk
            .sort((a, b) => a.d - b.d || b.loss - a.loss)
            .slice(0, 4)
            .forEach(({ p, b, d, left, loss }) => {
              const promo = p.price
                ? Math.max((p.cost || 0) * 1.02, p.price * 0.8)
                : 0;
              add(
                d <= 7 ? "r" : "a",
                d < 0 ? "🔴" : "🟠",
                d < 0
                  ? `Lote ${b.lot || "s/ nº"} de ${p.name} está vencido`
                  : `Lote ${b.lot || "s/ nº"} de ${p.name} vence em ${d} dia(s)`,
                d < 0
                  ? `Ainda constam ${num(b.qty)} ${p.unit} no sistema. Retire do estoque e registre a perda (${brl(b.qty * (p.cost || 0))} a custo).`
                  : `No ritmo atual devem sobrar ~${num(Math.round(left))} ${p.unit} (${brl(loss)} a custo). ${promo ? "Sugestão: promoção a " + brl(promo) + " ou transferir para outro local." : "Sugestão: promoção ou transferência."}`,
                loss,
                [
                  toPid(p),
                  [
                    "Ver lotes",
                    () => {
                      rf.kind = "lotes";
                      go("rel");
                    },
                  ],
                ],
              );
            });
        }

        // 3) capital parado
        const idle = db.settings.idleDays * DAY,
          par = act
            .filter(
              (p) => p.qty > 0 && Date.now() - (lastMove(p.id) || 0) > idle,
            )
            .map((p) => ({ p, v: p.qty * p.cost }))
            .sort((a, b) => b.v - a.v);
        if (par.length) {
          const tot = sum(par.map((x) => x.v));
          if (tot > 0)
            add(
              "a",
              "🧊",
              `${brl(tot)} parados em ${par.length} produto(s) sem giro`,
              `Sem movimentação há mais de ${db.settings.idleDays} dias. Maiores: ${par
                .slice(0, 3)
                .map((x) => x.p.name + " (" + brl(x.v) + ")")
                .join(
                  ", ",
                )}. Sugestão: promoção, combo ou devolução ao fornecedor.`,
              tot / 4,
              [
                [
                  "Ver parados",
                  () => {
                    rf.kind = "parados";
                    go("rel");
                  },
                ],
              ],
            );
        }

        // 4) margem baixa ou negativa nos produtos que mais vendem
        const mg = act
          .filter((p) => p.price > 0 && p.cost > 0)
          .map((p) => ({
            p,
            m: (p.price - p.cost) / p.price,
            vol: sum(U[p.id] || []),
          }))
          .filter((x) => x.m < 0.15)
          .sort((a, b) => b.vol - a.vol || a.m - b.m)
          .slice(0, 3);
        mg.forEach(({ p, m, vol }) =>
          add(
            m < 0 ? "r" : "a",
            m < 0 ? "🔴" : "🟠",
            m < 0
              ? p.name + ": vendido abaixo do custo"
              : p.name + ": margem de só " + Math.round(m * 100) + "%",
            `Custo ${brl(p.cost)} · preço ${brl(p.price)}. Para margem de 30%, o preço seria ${brl(p.cost / 0.7)}.${vol ? " Vendeu " + num(vol) + " " + p.unit + " nos últimos 90 dias." : ""}`,
            vol * Math.abs(p.price - p.cost),
            [toPid(p)],
          ),
        );

        // 5) variação semanal e produtos em alta/queda
        if (H >= 14) {
          const R = revByDay(14),
            a = sum(R.slice(7)),
            b = sum(R.slice(0, 7));
          if (b > 0 && Math.abs(a / b - 1) >= 0.2)
            add(
              a > b ? "i" : "a",
              a > b ? "📈" : "📉",
              `Receita dos últimos 7 dias ${a > b ? "subiu" : "caiu"} ${Math.round(Math.abs(a / b - 1) * 100)}%`,
              `${brl(a)} contra ${brl(b)} na semana anterior.`,
              Math.abs(a - b),
              [["Ver no painel", () => go("painel")]],
            );
          const mv = [];
          act.forEach((p) => {
            const u = U[p.id];
            if (!u) return;
            const x = sum(u.slice(-7)),
              y = sum(u.slice(-14, -7));
            if (Math.max(x, y) >= 5 && y > 0 && x / y >= 1.5)
              mv.push({ p, x, y, up: 1 });
            else if (y >= 5 && x / y <= 0.5) mv.push({ p, x, y, up: 0 });
          });
          mv.sort((a, b) => Math.abs(b.x - b.y) - Math.abs(a.x - a.y))
            .slice(0, 3)
            .forEach(({ p, x, y, up }) =>
              add(
                up ? "i" : "a",
                up ? "🚀" : "📉",
                p.name + (up ? ": vendas em alta" : ": vendas em queda"),
                `${num(x)} ${p.unit} nos últimos 7 dias contra ${num(y)} na semana anterior.${up ? " Considere reforçar o estoque." : " Verifique preço, exposição ou concorrência."}`,
                Math.abs(x - y) * (p.price || 0),
                [toPid(p)],
              ),
            );
        }

        // 6) dia fora do padrão
        if (H >= 21) {
          const n = Math.min(H, 56),
            R = revByDay(n),
            y = n - 2,
            wd = new Date(sod(Date.now()) - DAY).getDay();
          const same = R.filter(
            (_, k) =>
              k < y &&
              new Date(sod(Date.now()) - (n - 1 - k) * DAY).getDay() === wd,
          );
          if (same.length >= 3 && sd(same) > 0) {
            const z = (R[y] - mean(same)) / sd(same);
            if (Math.abs(z) >= 2)
              add(
                z > 0 ? "i" : "a",
                z > 0 ? "⭐" : "⚠️",
                `Ontem (${WD[wd]}) foi ${z > 0 ? "muito acima" : "muito abaixo"} do normal`,
                `Vendeu ${brl(R[y])}; numa ${WD[wd]} o comum é ${brl(mean(same))}.`,
                Math.abs(R[y] - mean(same)),
                [["Ver no painel", () => go("painel")]],
              );
          }
        }

        // 7) melhor dia da semana
        if (H >= 21) {
          const n = Math.min(H, 84),
            R = revByDay(n),
            by = Array(7).fill(0),
            c = Array(7).fill(0);
          R.forEach((v, k) => {
            const w = new Date(sod(Date.now()) - (n - 1 - k) * DAY).getDay();
            by[w] += v;
            c[w]++;
          });
          const avg = by.map((v, i) => (c[i] ? v / c[i] : 0)),
            best = avg.indexOf(Math.max(...avg)),
            worst = avg.indexOf(Math.min(...avg.filter((_, i) => c[i])));
          if (avg[best] > 0 && best !== worst)
            add(
              "i",
              "🗓️",
              `Seu melhor dia é ${WD[best]}`,
              `Média de ${brl(avg[best])} por ${WD[best]}; o mais fraco é ${WD[worst]} (${brl(avg[worst])}). Reforce o estoque antes do pico.`,
              0,
              [
                [
                  "Ver no painel",
                  () => {
                    PN.dim = "semana";
                    go("painel");
                  },
                ],
              ],
            );
        }

        if (!okSales().length)
          add(
            "i",
            "ℹ️",
            "Ainda não há vendas para analisar",
            "Os insights aparecem conforme você vende pelo PDV. Com 2 semanas de histórico as previsões ficam bem mais confiáveis.",
            0,
            [["Abrir PDV", () => go("pdv")]],
          );
        else if (H < 14)
          add(
            "i",
            "ℹ️",
            "Poucos dias de histórico (" + H + ")",
            "As previsões melhoram com 2 semanas ou mais de vendas registradas.",
            0,
          );

        if (typeof custInsights === "function") custInsights(add);
        const rk = { r: 0, a: 1, i: 2 };
        out.sort((x, y) => rk[x.sev] - rk[y.sev] || y.impact - x.impact);
        AI.cache = { k: key, v: out };
        return out;
      }
      function aiAct(i) {
        const f = AI.acts[i];
        if (f) f();
      }
      function insightCard(x) {
        const base = AI.acts.length;
        x.acts.forEach((a) => AI.acts.push(a[1]));
        return `<div class="card ins s${x.sev}"><b>${x.ic} ${esc(x.t)}</b><p>${esc(x.x)}</p>${x.acts.length ? `<div class="row" style="gap:8px">${x.acts.map((a, k) => `<button class="btn ghost sm" onclick="aiAct(${base + k})">${esc(a[0])}</button>`).join("")}</div>` : ""}</div>`;
      }
      function aiCard() {
        // cartão do início
        if (!can("rel") || !hasFeat("analise")) return "";
        AI.acts = [];
        const L = aiInsights()
          .filter((x) => x.sev !== "i" || okSales().length === 0)
          .slice(0, 2);
        return `<h2>💡 Giro IA sugere</h2>${L.length ? L.map(insightCard).join("") : '<div class="alert i">✅ Nada fora do normal nas suas vendas e no estoque.</div>'}<button class="btn ghost sm" onclick="go('ia')">Ver todos os insights e perguntar</button>`;
      }

      /* ---------- assistente ---------- */
      const STOP = new Set(
        "quanto quantos quantas tenho temos tem de do da dos das o a os as em no na nos nas um uma e que qual quais meu minha meus minhas para por pra com se me mostre mostra mostrar diga fale estoque saldo sobrou sobra ainda hoje agora favor pode voce".split(
          " ",
        ),
      );
      const has = (n, ...w) => w.some((x) => n.includes(x));
      function aiIntent(q) {
        const n = norm(q);
        return has(
          n,
          "quanto",
          "qual ",
          "quais",
          "mais vend",
          "acab",
          "vence",
          "parad",
          "margem",
          "lucro",
          "previs",
          "vendi",
          "faturamento",
          "ticket",
          "estoque de",
          "melhor dia",
        );
      }
      function aiPeriod(q) {
        const n = norm(q),
          now = Date.now(),
          t0 = sod(now);
        let m;
        if (has(n, "hoje")) return { from: t0, to: now, label: "hoje" };
        if (has(n, "ontem"))
          return { from: t0 - DAY, to: t0 - 1, label: "ontem" };
        if (has(n, "mes passado", "mes anterior")) {
          const d = new Date();
          return {
            from: new Date(d.getFullYear(), d.getMonth() - 1, 1).getTime(),
            to: new Date(d.getFullYear(), d.getMonth(), 1).getTime() - 1,
            label: "no mês passado",
          };
        }
        if (has(n, "este mes", "esse mes", "no mes", "do mes")) {
          const d = new Date();
          return {
            from: new Date(d.getFullYear(), d.getMonth(), 1).getTime(),
            to: now,
            label: "neste mês",
          };
        }
        if (has(n, "esta semana", "essa semana", "na semana"))
          return { from: t0 - 6 * DAY, to: now, label: "nos últimos 7 dias" };
        if (has(n, "este ano", "esse ano", "no ano"))
          return {
            from: new Date(new Date().getFullYear(), 0, 1).getTime(),
            to: now,
            label: "neste ano",
          };
        if ((m = /(\d{1,3})\s*dias/.exec(n))) {
          const k = Math.min(365, Math.max(1, +m[1]));
          return {
            from: t0 - (k - 1) * DAY,
            to: now,
            label: "nos últimos " + k + " dias",
          };
        }
        return { from: t0 - 29 * DAY, to: now, label: "nos últimos 30 dias" };
      }
      const plink = (p) =>
        `<a href="#" onclick="event.preventDefault();prodDetail('${p.id}')">${esc(p.name)}</a>`;
      function periodStats(per) {
        const S = okSales(per.from, per.to),
          rev = sum(S.map((s) => s.total)),
          cost = sum(S.flatMap((s) => s.items.map(itemCost)));
        return { S, rev, cost, n: S.length, tk: S.length ? rev / S.length : 0 };
      }
      function topProducts(S, by) {
        const m = {};
        S.forEach((s) =>
          s.items.forEach((i) => {
            const x =
              m[i.pid] ||
              (m[i.pid] = { pid: i.pid, name: i.name, q: 0, rev: 0, cost: 0 });
            x.q += i.qty;
            x.rev += itemRev(s, i);
            x.cost += itemCost(i);
          }),
        );
        return Object.values(m).sort((a, b) => b[by || "rev"] - a[by || "rev"]);
      }
      function prodAnswer(p) {
        const H = histDays(),
          U = unitsByDay(90),
          r = U[p.id] ? rateOf(U[p.id], H) : 0;
        let h = `<b>${plink(p)}</b>: saldo <b>${num(p.qty)} ${esc(p.unit)}</b>${p.min ? ` (mínimo ${num(p.min)})` : ""}, ${brl(p.qty * p.cost)} a custo.`;
        if (r > 0)
          h += `<br>Sai em média ${num(Math.round(r * 10) / 10)} ${esc(p.unit)}/dia; o estoque dura ~<b>${Math.floor(p.qty / r)} dia(s)</b>.`;
        else h += "<br>Sem vendas recentes registradas para estimar a duração.";
        const lots = (p.batches || [])
          .filter((b) => b.expiry && b.qty > 0)
          .sort((a, b) => (a.expiry < b.expiry ? -1 : 1))[0];
        if (lots)
          h += `<br>Próximo lote a vencer: ${esc(lots.lot || "s/ nº")} em ${dd(lots.expiry + "T12:00:00")} (${num(lots.qty)} ${esc(p.unit)}).`;
        return h;
      }
      function aiAnswer(q) {
        const n = norm(q),
          per = aiPeriod(q),
          H = histDays(),
          act = db.products.filter((p) => p.active),
          U = unitsByDay(90);
        const rowsP = (L, f) => "<ol>" + L.map(f).join("") + "</ol>";
        if (!n.trim())
          return "Pode perguntar, por exemplo: “quanto vendi hoje?”, “o que vai acabar?” ou “quanto tenho de arroz?”.";
        const ca = typeof custAsk === "function" ? custAsk(n) : null;
        if (ca) return ca;
        // saldo de um produto
        const rest = toks(q).filter((t) => !STOP.has(t));
        if (
          has(
            n,
            "estoque de",
            "saldo",
            "quanto tenho",
            "quantos tenho",
            "quanto temos",
            "tem ",
            "sobrou",
          ) &&
          rest.length
        ) {
          const L = smartFind(rest.join(" "), true);
          if (L.length)
            return (
              L.slice(0, 3).map(prodAnswer).join("<br><br>") +
              (L.length > 3
                ? `<br><br><span class="muted">Há mais ${L.length - 3} resultado(s); refine o nome.</span>`
                : "")
            );
        }
        if (
          has(
            n,
            "mais vend",
            "campe",
            "top ",
            "melhor produto",
            "vende mais",
            "giram mais",
          )
        ) {
          const T = topProducts(okSales(per.from, per.to)).slice(0, 5);
          return T.length
            ? `Produtos que mais renderam ${per.label}:` +
                rowsP(
                  T,
                  (x) =>
                    `<li>${esc(x.name)}: ${brl(x.rev)} (${num(x.q)} un.)</li>`,
                )
            : `Não há vendas ${per.label}.`;
        }
        if (
          has(
            n,
            "acab",
            "falt",
            "ruptura",
            "repor",
            "reposi",
            "comprar",
            "pedido",
            "pedir",
          )
        ) {
          const R = [];
          act.forEach((p) => {
            const r = U[p.id] ? rateOf(U[p.id], H) : 0;
            if (r > 0 && p.qty / r <= 10) R.push({ p, r, d: p.qty / r });
          });
          R.sort((a, b) => a.d - b.d);
          return R.length
            ? `Produtos que devem acabar em até 10 dias:` +
                rowsP(
                  R.slice(0, 8),
                  (x) =>
                    `<li>${plink(x.p)}: ${x.p.qty <= 0 ? "<b>sem estoque</b>" : "~" + Math.max(1, Math.round(x.d)) + " dia(s)"} · sugestão de compra ${num(Math.max(1, Math.ceil(x.r * 30 + x.p.min - x.p.qty)))} ${esc(x.p.unit)}</li>`,
                ) +
                `<button class="btn ghost sm" onclick="go('alert')">Abrir reposição</button>`
            : "Nenhum produto com ruptura prevista nos próximos 10 dias, pelo ritmo atual de vendas.";
        }
        if (has(n, "venc", "validade", "lote")) {
          const L = nearBatches();
          return L.length
            ? `Lotes que vencem em até ${db.settings.expiryDays} dias:` +
                rowsP(
                  L.slice(0, 8),
                  (x) =>
                    `<li>${plink(x.p)} · lote ${esc(x.b.lot || "s/ nº")}: ${x.d < 0 ? "<b>vencido</b>" : x.d + " dia(s)"} · ${num(x.b.qty)} ${esc(x.p.unit)}</li>`,
                )
            : lotsOn()
              ? "Nenhum lote perto de vencer."
              : "O controle de lote e validade não está ativo nesta conta.";
        }
        if (has(n, "parad", "encalh", "sem giro", "sem venda", "nao vende")) {
          const idle = db.settings.idleDays * DAY,
            P = act
              .filter(
                (p) => p.qty > 0 && Date.now() - (lastMove(p.id) || 0) > idle,
              )
              .sort((a, b) => b.qty * b.cost - a.qty * a.cost);
          return P.length
            ? `Produtos sem movimento há mais de ${db.settings.idleDays} dias (${brl(sum(P.map((p) => p.qty * p.cost)))} a custo):` +
                rowsP(
                  P.slice(0, 6),
                  (p) =>
                    `<li>${plink(p)}: ${num(p.qty)} ${esc(p.unit)} · ${brl(p.qty * p.cost)}</li>`,
                )
            : "Nenhum produto parado além do limite configurado.";
        }
        if (
          has(
            n,
            "previs",
            "vai vender",
            "proximos dias",
            "amanha",
            "semana que vem",
            "projec",
          )
        ) {
          const f = aiForecast();
          return f
            ? `Previsão para os próximos 7 dias: <b>${brl(f.total)}</b> (faixa provável ${brl(f.low)} a ${brl(f.high)}).` +
                rowsP(
                  f.days,
                  (d) => `<li>${WD[d.wd]} ${fmtDay(d.t)}: ${brl(d.v)}</li>`,
                ) +
                `<span class="muted">Estimativa pela média de cada dia da semana e pela tendência recente; não é garantia.</span>`
            : "Preciso de pelo menos 7 dias de vendas registradas para prever.";
        }
        if (has(n, "margem", "lucro", "lucrat")) {
          const a = periodStats(per);
          if (!a.n) return `Não há vendas ${per.label}.`;
          const L = topProducts(a.S, "rev")
            .map((x) => ({ ...x, m: x.rev - x.cost }))
            .sort((x, y) => y.m - x.m);
          return (

      const aiHelp = () =>

      /* ================= GIRO: painel de vendas (gráficos, período, comparação e variantes) ================= */
      const PN = {
        per: "30d",
        from: "",
        to: "",
        cmp: 1,
        met: "receita",
        dim: "categoria",
        view: "chart",
        cache: null,
      };
      const PERS = [
        ["hoje", "Hoje"],
        ["7d", "7 dias"],
        ["30d", "30 dias"],
        ["90d", "90 dias"],
        ["mes", "Este mês"],
        ["mesant", "Mês passado"],
        ["ano", "Este ano"],
        ["custom", "Outro"],

      const METS = {
        receita: ["Receita", "brl"],
        vendas: ["Vendas", "int"],
        itens: ["Itens vendidos", "num"],
        margem: ["Margem bruta", "brl"],
      };
      const DIMS = {
        categoria: "Categoria",
        produto: "Produto",
        pagamento: "Pagamento",
        operador: "Operador",
        semana: "Dia da semana",
        hora: "Hora do dia",
        local: "Local",
      };
      const fmtM = (v, m) =>
        METS[m][1] === "brl" ? brl(v) : num(Math.round(v * 10) / 10);
      const shortM = (v, m) => {
        const b = METS[m][1] === "brl",
          a = Math.abs(v);
        let s =
          a >= 1e6
            ? (a / 1e6).toFixed(1).replace(".", ",") + " mi"
            : a >= 1e4
              ? Math.round(a / 1e3) + " mil"
              : a >= 1e3
                ? (a / 1e3).toFixed(1).replace(".", ",") + " mil"
                : num(Math.round(a * 10) / 10);
        return (v < 0 ? "−" : "") + (b ? "R$ " : "") + s;
      };

      function pnRange() {
        const now = Date.now(),
          t0 = sod(now),
          d = new Date(),
          k = PN.per;
        let from,
          to = now;
        if (k === "hoje") from = t0;
        else if (k === "7d") from = t0 - 6 * DAY;
        else if (k === "30d") from = t0 - 29 * DAY;
        else if (k === "90d") from = t0 - 89 * DAY;
        else if (k === "mes")
          from = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
        else if (k === "mesant") {
          from = new Date(d.getFullYear(), d.getMonth() - 1, 1).getTime();
          to = new Date(d.getFullYear(), d.getMonth(), 1).getTime() - 1;
        } else if (k === "ano")
          from = new Date(d.getFullYear(), 0, 1).getTime();
        else {
          from = PN.from
            ? new Date(PN.from + "T00:00:00").getTime()
            : t0 - 29 * DAY;
          to = PN.to ? new Date(PN.to + "T23:59:59").getTime() : now;
        }
        if (to < from) to = from + DAY - 1;
        const len = to - from + 1,
          days = Math.max(1, Math.floor((sod(to) - sod(from)) / DAY) + 1);
        let pf = from - days * DAY,
          pt = pf + len - 1; // mesmo trecho decorrido do período anterior (comparação justa quando o período ainda está aberto)
        if (k === "mes") {
          pf = new Date(d.getFullYear(), d.getMonth() - 1, 1).getTime();
          pt = Math.min(pf + len - 1, from - 1);
        }
        if (k === "ano") {
          pf = new Date(d.getFullYear() - 1, 0, 1).getTime();
          pt = pf + len - 1;
        }
        const gran =
          k === "hoje" || days <= 1
            ? "h"
            : days <= 45
              ? "d"
              : days <= 200
                ? "w"
                : "m";
        return { from, to, pf, pt, days, gran, len };
      }
      function bucketOf(t, r, from) {
        // índice do balde (relativo ao início do período) e rótulo
        if (r.gran === "h") return new Date(t).getHours();
        if (r.gran === "d") return Math.floor((sod(t) - sod(from)) / DAY);
        if (r.gran === "w") return Math.floor((sod(t) - sod(from)) / (7 * DAY));
        const a = new Date(from),
          b = new Date(t);
        return (
          (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth()
        );
      }
      function bucketLabel(i, r, from) {
        if (r.gran === "h") return i + "h";
        if (r.gran === "d") return fmtDay(sod(from) + i * DAY);
        if (r.gran === "w") {
          const t = sod(from) + i * 7 * DAY;
          return fmtDay(t) + " a " + fmtDay(t + 6 * DAY);
        }
        const a = new Date(from);
        return new Date(a.getFullYear(), a.getMonth() + i, 1)
          .toLocaleDateString("pt-BR", { month: "short", year: "2-digit" })
          .replace(".", "");
      }
      const nBuckets = (r) =>
        r.gran === "h"
          ? 24
          : r.gran === "d"
            ? r.days
            : r.gran === "w"
              ? Math.ceil(r.days / 7)
              : (new Date(r.to).getFullYear() -
                  new Date(r.from).getFullYear()) *
                  12 +
                new Date(r.to).getMonth() -
                new Date(r.from).getMonth() +
                1;

      const sMet = (s, m) =>
        m === "receita"
          ? s.total
          : m === "vendas"
            ? 1
            : m === "itens"
              ? sum(s.items.map((i) => i.qty))
              : s.total - sum(s.items.map(itemCost));
      const iMet = (s, i, m) =>
        m === "receita"
          ? itemRev(s, i)
          : m === "itens"
            ? i.qty
            : m === "margem"
              ? itemRev(s, i) - itemCost(i)
              : 0;
      const locOfItem = (i) => {
        const p = prodOf(i.pid);
        const L = (i.lots || []).filter((l) => l.loc);
        if (L.length) {
          const t = sum(L.map((l) => l.qty)) || 1;
          return L.map((l) => [l.loc, l.qty / t]);
        }
        return [[(p && mainLoc(p)) || "Principal", 1]];
      };
      function dimKeys(dim, s, i) {
        // [[chave,peso]]
        if (dim === "categoria") {
          const p = prodOf(i.pid);
          return [[(p && p.category) || "Sem categoria", 1]];

        if (dim === "operador") return [[s.user || "—", 1]];

      }
      const ITEM_DIMS = ["categoria", "produto", "local"];
      function groupBy(S, dim, met) {
        const m = new Map(),
