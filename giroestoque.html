          if (item) {
            const seen = new Set();
            s.items.forEach((i) =>
              dimKeys(dim, s, i).forEach(([k, w]) => {
                const v =
                  met === "vendas"
                    ? seen.has(k)
                      ? 0
                      : 1
                    : iMet(s, i, met) * w;
                seen.add(k);
                m.set(k, (m.get(k) || 0) + v);
              }),
            );
          } else {
            const v = sMet(s, met);
            dimKeys(dim, s).forEach(([k, w]) =>
              m.set(k, (m.get(k) || 0) + v * w),
            );
          }
        });
        return m;
      }
      function pnData() {
        const r = pnRange(),
          S = okSales(r.from, r.to),
          Pv = PN.cmp ? okSales(r.pf, r.pt) : [],
          met = PN.met;
        const nb = Math.min(nBuckets(r), 400),
          cur = Array(nb).fill(0),
          prv = Array(nb).fill(0);
        S.forEach((s) => {
          const k = bucketOf(s.ts, r, r.from);
          if (k >= 0 && k < nb) cur[k] += sMet(s, met);
        });
        Pv.forEach((s) => {
          const k = bucketOf(s.ts, r, r.pf);
          if (k >= 0 && k < nb) prv[k] += sMet(s, met);
        });
        const kp = (a) => ({
          rev: sum(a.map((s) => s.total)),
          n: a.length,
          items: sum(a.map((s) => sum(s.items.map((i) => i.qty)))),
          mar: sum(a.map((s) => sMet(s, "margem"))),
        });
        const K = kp(S),
          KP = kp(Pv);
        // variantes
        const g = groupBy(S, PN.dim, met),
          gp = PN.cmp ? groupBy(Pv, PN.dim, met) : new Map();
        let rows;
        if (PN.dim === "semana")
          rows = [0, 1, 2, 3, 4, 5, 6].map((k) => ({
            k,
            label: WDS[k],
            v: g.get(k) || 0,
            p: gp.get(k) || 0,
          }));
        else if (PN.dim === "hora") {
          const ks = [...g.keys(), ...gp.keys()];
          const a = ks.length ? Math.min(...ks) : 8,
            b = ks.length ? Math.max(...ks) : 18;
          rows = [];
          for (let h = a; h <= b; h++)
            rows.push({
              k: h,
              label: h + "h",
              v: g.get(h) || 0,
              p: gp.get(h) || 0,
            });
        } else {
          rows = [...g.entries()]
            .map(([k, v]) => ({ k, label: String(k), v, p: gp.get(k) || 0 }))
            .sort((a, b) => b.v - a.v);
          if (rows.length > 8) {
            const top = rows.slice(0, 7),
              rest = rows.slice(7);
            rows = [
              ...top,
              {
                k: "__o",
                label: "Outros (" + rest.length + ")",
                v: sum(rest.map((x) => x.v)),
                p: sum(rest.map((x) => x.p)),

          met,
          cur,
          prv,

      const dlt = (a, b) => (b > 0 ? a / b - 1 : null);
      function dltHTML(a, b, inv) {

            : '<span class="dl">sem base de comparação</span>';

        const up = d > 0,
          good = inv ? !up : up;
        return `<span class="dl ${good ? "g" : "b"}">${up ? "▲" : "▼"} ${Math.abs(Math.round(d * 100))}% <i>${good ? "melhor" : "pior"}</i></span>`;
      }
      function niceMax(v) {
        if (v <= 0) return 1;
        const e = Math.pow(10, Math.floor(Math.log10(v))),
          f = v / e,
          n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
        return n * e;
      }

      /* ---------- gráfico de linha (série temporal) ---------- */
      function lineChart(W) {
        const D = PN.cache,
          H = 240,
          ml = 52,
          mr = 14,
          mt = 14,
          mb = 28,

          ph = H - mt - mb,
          n = D.cur.length,
          met = D.met;
        const mx = niceMax(Math.max(...D.cur, ...(PN.cmp ? D.prv : [0]), 1)),

          Y = (v) => mt + ph - (ph * v) / mx;

            .map(

       ${PN.cmp && n > 1 ? `<path d="${path(D.prv)}" class="lp"/>` : ""}${area}${n > 1 ? `<path d="${path(D.cur)}" class="lc"/>` : ""}${single}
       <line id="pn_x" y1="${mt}" y2="${mt + ph}" class="cx" style="display:none"/><circle id="pn_dc" r="5" class="dc" style="display:none"/><circle id="pn_dp" r="5" class="dp" style="display:none"/>
       <text x="${Math.min(W - mr, X(last))}" y="${Math.max(mt + 10, Y(D.cur[last]) - 9)}" text-anchor="end" class="dlab">${shortM(D.cur[last], met)}</text>
       <rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="transparent" class="hit" onpointermove="pnLine(event)" onpointerleave="pnOut()" onpointerdown="pnLine(event)"/></svg>`;
      }
      function pnLine(e) {

          W = svg.viewBox.baseVal.width,
          sc = W / rc.width,

          mt = 14,
          mb = 28,
          H = 240,
          pw = W - ml - mr,

        const x = (e.clientX - rc.left) * sc,

        const mx = niceMax(Math.max(...D.cur, ...(PN.cmp ? D.prv : [0]), 1)),

          lbP = bucketLabel(i, D.r, D.r.pf);

          `<b>${esc(lbC)}</b><div><i class="sw c"></i>Atual: <b>${fmtM(D.cur[i], D.met)}</b></div>${PN.cmp ? `<div><i class="sw p"></i>Anterior (${esc(lbP)}): <b>${fmtM(D.prv[i], D.met)}</b></div><div>${dltHTML(D.cur[i], D.prv[i])}</div>` : ""}`,

      function pnOut() {

      function pnTip(html, e) {

      /* ================= GIRO: busca inteligente e preenchimento automático =================

      /* ---------- ranking ---------- */
      function lev(a, b, max) {
        // distância de edição com corte
        if (Math.abs(a.length - b.length) > max) return max + 1;
        let p = Array.from({ length: b.length + 1 }, (_, i) => i);
        for (let i = 1; i <= a.length; i++) {
          const c = [i];
          let mn = i;
          for (let j = 1; j <= b.length; j++) {
            const v = Math.min(
              p[j] + 1,
              c[j - 1] + 1,
              p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
            );
            c.push(v);
            if (v < mn) mn = v;
          }
          if (mn > max) return max + 1;
          p = c;
        }
        return p[b.length];
      }
      const _pop = { k: "", m: {} };
      function popMap() {
        const k =
          db.sales.length + ":" + (db.sales[db.sales.length - 1] || {}).id;
        if (_pop.k !== k) {
          const m = {},
            now = Date.now();
          db.sales.forEach((s) => {
            if (s.status !== "ok") return;
            const age = (now - s.ts) / DAY;
            if (age > 120) return;
            const w = Math.pow(0.5, age / 30);
            s.items.forEach((i) => {
              m[i.pid] = (m[i.pid] || 0) + i.qty * w;
            });
          });
          _pop.k = k;
          _pop.m = m;
        }
        return _pop.m;
      }
      const toks = (q) =>
        norm(q)
          .split(/[^a-z0-9]+/)
          .filter(Boolean);
      function prodScore(p, T, pop) {
        const nm = norm(p.name),
          words = nm.split(/[^a-z0-9]+/).filter(Boolean),
          code = norm(p.code),
          bar = norm(p.barcode),
          oth = norm((p.brand || "") + " " + (p.category || ""));
        let s = 0;
        for (const t of T) {
          let b = 0;
          if ((bar && bar === t) || (code && code === t)) b = 14;
          else if ((bar && bar.startsWith(t)) || (code && code.startsWith(t)))
            b = 10;
          else if (
            (bar && t.length >= 4 && bar.includes(t)) ||
            (code && t.length >= 3 && code.includes(t))
          )
            b = 6;
          for (const w of words) {
            if (w === t) b = Math.max(b, 10);
            else if (w.startsWith(t)) b = Math.max(b, 8);
            else if (t.length >= 3 && w.includes(t)) b = Math.max(b, 5);
            else if (t.length >= 4) {
              const d = lev(
                t,
                w.length > t.length + 1 ? w.slice(0, t.length + 1) : w,
                t.length >= 7 ? 2 : 1,
              );
              if (d <= (t.length >= 7 ? 2 : 1)) b = Math.max(b, 4 - d * 0.5);
            }
          }
          if (!b && t.length >= 2 && oth.includes(t)) b = 3;
          if (!b) return 0; // todas as palavras digitadas precisam casar
          s += b;
        }
        if (nm.startsWith(T.join(" "))) s += 3;
        s += Math.log1p(pop[p.id] || 0) * 1.4;
        if (!p.active) s -= 2;
        return Math.max(s, 0.1);
      }

            .sort((a, b) => b[1] - a[1] || a[0].name.localeCompare(b[0].name))
            .map((x) => x[0])
            .slice(0, 40);
        return src
          .map((p) => [p, prodScore(p, T, pop)])
          .filter((x) => x[1] > 0)
          .sort((a, b) => b[1] - a[1] || a[0].name.localeCompare(b[0].name))
          .map((x) => x[0])

      function hl(txt, q) {
        // destaca o trecho digitado, sem diferenciar acento/maiúscula
        const s = String(txt || ""),
          n = norm(s),
          T = toks(q).sort((a, b) => b.length - a.length);
        if (n.length !== s.length) return esc(s);
        const hit = Array(s.length).fill(0);
        T.forEach((t) => {
          let i = n.indexOf(t);
          while (i >= 0) {
            for (let k = i; k < i + t.length; k++) hit[k] = 1;
            i = n.indexOf(t, i + t.length);
          }
        });
        let o = "",
          on = false;
        for (let i = 0; i < s.length; i++) {
          if (hit[i] && !on) {
            o += "<mark>";
            on = true;
          }
          if (!hit[i] && on) {
            o += "</mark>";
            on = false;
          }
          o += esc(s[i]);
        }
        return o + (on ? "</mark>" : "");
      }

            t:
              pont === null
                ? "Ainda sem contas vencidas ou quitadas para avaliar."
                : `${nSet} conta(s) quitada(s)${late ? `, ${late} fora do prazo` : ", todas no prazo"}.`,
          },
          {
            k: "atual",
            l: "Situação atual",
            w: 0.27,
            v: atual,
            t:
              od > 0
                ? `${brl(od)} vencido há até ${md} dia(s).`
                : custBalance(c.id) > 0
                  ? `${brl(custBalance(c.id))} a vencer, sem atraso.`
                  : "Sem dívida em aberto.",
          },
          {
            k: "rel",
            l: "Tempo de relacionamento",
            w: 0.15,
            v: rel,
            t: st.first
              ? `${Math.max(0, Math.floor(ten))} mês(es) de casa, ${st.n} compra(s).`
              : "Ainda não comprou.",
          },
          {
            k: "rf",
            l: "Recência e frequência",
            w: 0.1,
            v: rf,
            t: st.last
              ? `Última compra há ${Math.floor(since)} dia(s); ${st.n90} compra(s) nos últimos 90 dias.`
              : "Sem compras.",
          },
          {
            k: "vol",
            l: "Volume de compras (90 dias)",
            w: 0.1,
            v: vol,
            t:
              st.v90 > 0
                ? `${brl(st.v90)} nos últimos 90 dias.`
                : "Sem compras no período.",
          },
        ];
        let score = Math.round(1000 * F.reduce((a, f) => a + f.w * f.v, 0)),
          cap = "";
        if (md > 60 && score > 400) {
          score = 400;
          cap = "Limitado a 400 por ter conta vencida há mais de 60 dias.";
        } else if (md > 30 && score > 600) {
          score = 600;
          cap = "Limitado a 600 por ter conta vencida há mais de 30 dias.";
        }
        const cl = SC_CLS.find((x) => score >= x[0]),
          events = nSet + late + st.n;
        return {
          score,
          cls: cl[1],
          label: cl[2],
          F,
          cap,
          conf: events >= 6 ? "alta" : events >= 3 ? "média" : "baixa",
          events,
        };
      }
      function custLimitSuggest(c) {
        const st = custStats(c),
          sc = custScore(c),
          f = { A: 1, B: 0.6, C: 0.3, D: 0.1, E: 0 }[sc.cls];
        if (sc.events < 3 || !st.avgMonth)
          return {
            v: 0,
            why: "Ainda sem histórico suficiente. Defina um limite pequeno manualmente e acompanhe.",
          };
        const v = Math.round((st.avgMonth * f) / 10) * 10;
        return {

      const custAvail = (c) =>

      /* ---------- regras do fiado ---------- */
      function fiadoCheck(c, total, auth) {
        const cfg = cliCfg(),
          sc = custScore(c),
          bal = custBalance(c.id),
          why = [];
        if (c.active === false) why.push("Cliente inativo.");
        if (c.blocked)
          why.push(
            "Cliente bloqueado para fiado" +
              (c.blockWhy ? ": " + c.blockWhy : "") +
              ".",
          );
        if (!(+c.limit > 0))
          why.push("Cliente sem limite de crédito definido.");
        else if (bal + total > c.limit + 0.005)
          why.push(
            `Passa do limite: dívida ${brl(bal)} + esta venda ${brl(total)} > limite ${brl(c.limit)}.`,
          );
        const md = custMaxDelay(c.id);
        if (cfg.maxAtraso >= 0 && md > cfg.maxAtraso)
          why.push(
            `Tem conta vencida há ${md} dia(s) (máximo aceito: ${cfg.maxAtraso}).`,
          );
        if (cfg.bloqueiaE && sc.cls === "E" && sc.events >= 3)
          why.push("Score na faixa de risco alto (E).");
        return { ok: !why.length, why, canAuth: can("cliadm"), sc };
      }
      let pdvCust = "",

        if (due < sod(Date.now()))

        db.receivables = db.receivables || [];

      function custPick() {
        if (!cliOn()) return;
        modal(
          `<h1>Identificar cliente</h1><input id="cp_q" type="search" autocomplete="off" placeholder="Nome, CPF/CNPJ ou telefone" oninput="custPickDraw()" onkeydown="custPickKey(event)"><div id="cp_l" style="margin-top:8px"></div><br><button class="btn ghost full" onclick="custEdit('',1)">➕ Cadastrar novo cliente</button><br><br><button class="btn ghost full" onclick="closeModal()">Cancelar</button>`,
        );

      function custFind(q, onlyAct) {
        const T = toks(q),
          dq = onlyD(q);
        const src = (db.customers || []).filter(
          (c) => !onlyAct || c.active !== false,
        );
        if (!T.length && !dq)
          return src
            .map((c) => [c, custStats(c).last])
            .sort((a, b) => b[1] - a[1])
            .map((x) => x[0])
            .slice(0, 30);
        const pop = src.map((c) => [c, custStats(c).n]);
        return pop
          .map(([c, n]) => {
            const nm = norm(c.name),
              w = nm.split(/[^a-z0-9]+/).filter(Boolean);
            let s = 0;
            for (const t of T) {
              let b = 0;
              for (const x of w) {
                if (x === t) b = Math.max(b, 10);
                else if (x.startsWith(t)) b = Math.max(b, 8);
                else if (t.length >= 3 && x.includes(t)) b = Math.max(b, 5);
                else if (
                  t.length >= 4 &&
                  lev(t, x.slice(0, t.length + 1), 1) <= 1
                )
                  b = Math.max(b, 4);
              }
              if (!b && norm(c.email || "").includes(t)) b = 3;
              if (!b && /^\d+$/.test(t) && dq.length >= 3) continue;
              if (!b) return [c, 0];
              s += b;
            }
            if (dq.length >= 3) {
              if (onlyD(c.doc).includes(dq) || onlyD(c.phone).includes(dq))
                s += 12;
              else if (!T.some((t) => /[a-z]/.test(t))) return [c, 0];
            }
            return [c, s + Math.log1p(n)];
          })
          .filter((x) => x[1] > 0)
          .sort((a, b) => b[1] - a[1])
          .map((x) => x[0])
          .slice(0, 30);
      }

       <label for="rc_amt">Valor recebido (R$)</label><input id="rc_amt" type="number" step="any" min="0.01" value="${tot}"><p class="muted">Pode ser menos que o total (pagamento parcial). O valor abate primeiro as contas mais antigas.</p>
       <label>Forma de pagamento</label><div class="pay">${PAYM.map((m, i) => `<button class="chip ${i === 0 ? "on" : ""}" onclick="document.querySelectorAll('#rc_m .chip').forEach(x=>x.classList.remove('on'));this.classList.add('on');window._rcvm='${m}'">${m}</button>`).join("")}</div><span id="rc_m" style="display:none"></span>
       <br><button class="btn full" onclick="rcvDo()">Registrar recebimento</button><br><br><button class="btn ghost full" onclick="closeModal()">Cancelar</button>`);
        window._rcvm = "Dinheiro";

      function rcvDo() {
        if (rwBlock()) return;
        const { cid, rid } = window._rcv || {},
          amt = r2(+($("#rc_amt") || {}).value || 0),
          m = window._rcvm || "Dinheiro";
        if (!(amt > 0)) {
          toast("Informe o valor recebido.", 1);
          return;
        }
        let rec = [],
          left = 0;
        try {
          tx(() => {
            const c = custById(cid);
            if (!c) throw Error("Cliente não encontrado.");
            const L = (
                rid ? custRcv(cid).filter((r) => r.id === rid) : custRcv(cid)
              ).sort((a, b) => a.due - b.due),
              tot = r2(L.reduce((a, r) => a + rcvTotal(r), 0));
            if (amt > tot + 0.005)
              throw Error(
                "O valor é maior que o total em aberto (" + brl(tot) + ").",
              );
            let rest = amt;
            const cx = caixaAberto();
            db.rcvPay = db.rcvPay || [];
            for (const r of L) {
              if (rest <= 0.004) break;
              const due = rcvTotal(r),
                a = Math.min(rest, due),
                enc = Math.min(a, rcvEnc(r));
              const p = {
                id: uid(),
                rid: r.id,
                cid,
                ts: Date.now(),
                amt: r2(a),
                enc: r2(enc),
                method: m,
                user: curUser().name,
                caixa: cx ? cx.id : "",
              };
              db.rcvPay.push(p);
              rec.push({ r, a: p.amt });
              rest = r2(rest - a);
            }
            left = custBalance(cid);
            aud(
              "Recebimento de cliente",
              c.name + " · " + brl(amt) + " · " + m,
            );
          });
        } catch (e) {
          toast(e.message, 1);
          return;

          tot = r2(L.reduce((a, r) => a + rcvTotal(r), 0));

          first = (c.name || "").split(" ")[0];

          ? `\nPara pagar por Pix use a chave: ${db.company.pix}`
          : "";

          cfg.msg ||
          "Olá, {nome}! Tudo bem? Aqui é da {empresa}. {situacao} Total: {valor}.{pix}\nSe já pagou, pode desconsiderar. Qualquer dúvida é só responder por aqui.";

          ? `Identificamos ${od.length} conta(s) vencida(s), a mais antiga desde ${dd(od[0].due)}.`

        const all = (db.customers || []).filter((c) => c.active !== false);

       ${
         L.length

               .map((c) => {
                 const s = custScore(c),

      VIEWS.cliente = () => {

        const st = custStats(c),

        return `${banner()}<div class="row"><button class="btn ghost sm fit" onclick="go('clientes')">← Clientes</button><span></span></div>

       <p class="muted" style="margin:0 0 8px">${segBadge(sg)} ${esc(sg.tip)}<br>${c.doc ? esc(maskDoc(c.doc)) + " · " : ""}${c.phone ? esc(fmtPhone(c.phone)) : "sem celular"}${c.email ? " · " + esc(c.email) : ""}${c.addr ? "<br>" + esc(c.addr) : ""}${c.birth ? "<br>Aniversário: " + dd(c.birth + "T12:00:00").slice(0, 5) : ""}${c.notes ? "<br>Obs.: " + esc(c.notes) : ""}</p>

       <h2>Score de crédito</h2><div class="card"><div class="row"><div><div class="scbig s${sc.cls}">${sc.score}</div><span class="muted">de 1000</span></div><div style="text-align:right">${scBadge(sc)}<br><span class="muted">Confiança ${sc.conf} (${sc.events} evento(s))</span></div></div>

       <div class="scale" aria-hidden="true"><i style="left:${sc.score / 10}%"></i></div><div class="row muted" style="font-size:12px"><span>0</span><span style="text-align:center">500</span><span style="text-align:right">1000</span></div>

       <h2>Crédito (fiado)</h2><div class="card"><div class="row"><div><span class="muted">Limite</span><div style="font-size:19px;font-weight:700">${brl(c.limit || 0)}</div></div><div><span class="muted">Em aberto</span><div style="font-size:19px;font-weight:700">${brl(bal)}</div></div><div><span class="muted">Disponível</span><div style="font-size:19px;font-weight:700">${brl(custAvail(c))}</div></div></div>
       ${od > 0 ? `<p class="dl b">▲ ${brl(od)} vencido há até ${custMaxDelay(c.id)} dia(s)</p>` : ""}${lastCob ? `<p class="muted">Última cobrança: ${dt(lastCob.ts)} (${esc(lastCob.user)})</p>` : ""}
       ${can("cliadm") ? `<p class="muted">Limite sugerido: <b>${brl(lim.v)}</b>. ${esc(lim.why)}</p><div class="row noprint">${lim.v > 0 && lim.v !== (+c.limit || 0) ? `<button class="btn ghost sm" onclick="custSetLimit('${c.id}',${lim.v})">Aplicar sugestão</button>` : ""}<button class="btn ghost sm" onclick="custBlock('${c.id}')">${c.blocked ? "Liberar fiado" : "Bloquear fiado"}</button></div>` : ""}</div>
       <div class="grid"><div class="kpi pk"><small>Total comprado</small><div>${brl(st.tot)}</div></div><div class="kpi pk"><small>Compras</small><div>${st.n}</div></div><div class="kpi pk"><small>Ticket médio</small><div>${brl(st.tk)}</div></div><div class="kpi pk"><small>Última compra</small><div style="font-size:20px">${st.last ? dd(st.last) : "—"}</div>${st.gap ? `<small>costuma voltar a cada ${Math.round(st.gap)} dia(s)</small>` : ""}</div></div>
       ${
         R.length
           ? `<h2>Contas em aberto</h2>${R.map((r) => {
               const d = rcvDays(r);
               return `<div class="card"><div class="row"><div><b>${esc(r.desc)}</b><br><span class="muted">Vence ${dd(r.due)}${d > 0 ? ` · <b class="dl b">${d} dia(s) de atraso</b>` : d === 0 ? " · vence hoje" : ""}</span></div><div style="text-align:right"><b>${brl(rcvTotal(r))}</b>${rcvOpen(r) < r.amount ? `<br><span class="muted">de ${brl(r.amount)}</span>` : ""}</div></div>${can("cobr") ? `<button class="btn sm" style="margin-top:8px" onclick="rcvModal('${c.id}','${r.id}')">Receber</button>` : ""}</div>`;
             }).join("")}`
           : ""
       }
       ${st.top.length ? `<h2>Produtos que mais compra</h2><div class="card">${st.top.map((p) => `<div class="row"><span>${esc(p.name)}</span><span class="muted" style="text-align:right">${num(p.q)} un. · ${brl(p.rev)}</span></div>`).join("")}</div>` : ""}
       <h2>Histórico</h2>${TL.length ? TL.map((e, i) => `<div class="item" ${e.f ? `onclick="_tl[${i}].f()"` : ""}><div class="im">${e.ic}</div><div class="t"><b>${esc(e.t)}</b><small>${dt(e.ts)}</small></div>${e.f ? "›" : ""}</div>`).join("") : '<p class="muted">Nenhuma compra ou pagamento ainda.</p>'}
       <h2>Privacidade (LGPD)</h2><div class="card"><p class="muted" style="margin-top:0">${c.consent ? "Autorizou ofertas em " + dd(c.consent.ts) + "." : "Não autorizou ofertas e novidades."} Cadastrado em ${dd(c.createdAt)} por ${esc(c.createdBy || "—")}.</p><div class="row noprint"><button class="btn ghost sm" onclick="custExport('${c.id}')">⬇️ Exportar dados do cliente</button>${can("cliadm") ? `<button class="btn ghost sm" onclick="custAnon('${c.id}')">Anonimizar</button>` : ""}</div></div>`;
      };

          )
        )
          return;
        try {
          tx(() => {
            const c = custById(id),
              old = c.name;
            Object.assign(c, {
              name: "Cliente removido #" + c.n,
              doc: "",

              notes: "",

        go("clientes");
        render();
        toast("Cliente anonimizado.");

      /* cobranças */
      const AGE = [
        ["a vencer", -1e9, 0],
        ["1 a 30 dias", 1, 30],
        ["31 a 60 dias", 31, 60],
        ["61 a 90 dias", 61, 90],
        ["mais de 90 dias", 91, 1e9],
      ];
      VIEWS.cobrancas = () => {
        if (!cliOn()) return cliLock("💵 Contas a receber");
        const R = (db.receivables || []).filter(
          (r) => r.status !== "cancelada" && rcvOpen(r) > 0,
        );
        const by = AGE.map(([l, a, b]) => ({
          l,
          v: r2(
            R.filter((r) => {
              const d = rcvDays(r);
              return a === -1e9 ? d <= 0 : d >= a && d <= b;
            }).reduce((s, r) => s + rcvOpen(r), 0),
          ),
          n: R.filter((r) => {
            const d = rcvDays(r);
            return a === -1e9 ? d <= 0 : d >= a && d <= b;
          }).length,
        }));
        const tot = sum(by.map((x) => x.v)),
          mx = Math.max(...by.map((x) => x.v), 1);

        R.forEach((r) => {
          (per[r.cid] = per[r.cid] || []).push(r);
        });
        const rows = Object.entries(per)
          .map(([cid, L]) => ({
            c: custById(cid),

       <h2>Quem deve</h2>${
         rows.length
           ? rows
               .map(({ c, od, bal, md, next }) => {
                 const sc = custScore(c);
                 return `<div class="card"><div class="row"><div onclick="go('cliente?id=${c.id}')" style="cursor:pointer"><b>${esc(c.name)}</b> ${scBadge(sc, 1)}<br><span class="muted">${md > 0 ? `<b class="dl b">${md} dia(s) de atraso</b> · ` : "Próximo vencimento " + dd(next) + " · "}deve ${brl(bal)}</span></div></div><div class="row noprint" style="margin-top:8px">${can("cobr") ? `<button class="btn sm" onclick="rcvModal('${c.id}')">Receber</button>` : ""}${c.phone && can("cobr") ? `<button class="btn ghost sm" onclick="cobSend('${c.id}')">💬 Cobrar</button>` : ""}</div></div>`;
               })
               .join("")
           : emptyBox("✅", "Ninguém deve nada agora.")
       }

      function custAsk(n) {

      /* caixa: dinheiro recebido de clientes durante o turno entra na gaveta */

      /* ===== Modo servidor: dados guardados com segurança no servidor do Giro =====
         O app continua rápido e síncrono: o navegador mantém uma cópia local (cache) e envia as mudanças ao servidor
         logo depois de cada gravação. Se duas pessoas gravarem ao mesmo tempo, as mudanças são juntadas (merge em 3 vias):
         saldos somam as variações de cada um, registros novos de ambos são mantidos. O servidor é quem decide
         quem pode gravar (assinatura em dia, perfil e empresa). Fora do servidor (arquivo aberto direto) tudo funciona como antes, só neste aparelho. */
      const SV = {
        on: false,
        checked: false,
        rev: 0,
        base: null,
        dirty: false,
        busy: false,
        timer: null,
        poll: null,
        skew: 0,
        offline: false,
        serverEmpty: false,
        force: false,
        conflicts: 0,
        blocked: "",
        lastOk: 0,
        plans: null,
        cfg: null,
        platOk: false,
        usage: {},
      };
      const NOW = () => Date.now() + (SV.skew || 0);
      const svLS = {
        get: (k) => {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        },
        set: (k, v) => {
          try {
            localStorage.setItem(k, v);
          } catch (e) {}
        },
        del: (k) => {
          try {
            localStorage.removeItem(k);
          } catch (e) {}
        },
      };

      async function api(method, path, body) {
        let r;
        try {
          r = await fetch(path, {
            method,
            credentials: "same-origin",
            headers: { "x-giro": "1", "content-type": "application/json" },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
        } catch (e) {
          SV.offline = true;
          svStatus();
          return {
            ok: false,
            status: 0,
            offline: true,
            data: { error: "Sem conexão com o servidor." },
          };
        }
        SV.offline = false;
        let d = {};
        try {
          d = await r.json();
        } catch (e) {}
        return { ok: r.ok, status: r.status, data: d };
      }
      const apiErr = (r) =>
        toast(
          (r.data && r.data.error) ||
            "Não foi possível concluir. Tente de novo.",
          1,
        );

      /* ---------- juntar mudanças (merge em 3 vias) ---------- */
      const jeq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
      const isObj = (x) => x && typeof x === "object" && !Array.isArray(x);
      const hasIds = (a) =>
        a.length > 0 && a.every((x) => isObj(x) && x.id !== undefined);
      const COUNTER_KEYS = new Set(["qty", "stock", "seq"]);
      function svMerge3(b, m, t, key, parent, st) {
        if (jeq(m, b)) return t;
        if (jeq(t, b)) return m;
        if (jeq(m, t)) return m;
        st = st || { c: 0 };
        if (
          typeof m === "number" &&
          typeof t === "number" &&
          typeof b === "number" &&
          (COUNTER_KEYS.has(key) || COUNTER_KEYS.has(parent))
        )
          return Math.round((t + (m - b)) * 1000) / 1000; // contadores: soma a variação de cada lado
        if (Array.isArray(m) && Array.isArray(t)) {
          const bb = Array.isArray(b) ? b : [];
          if (key === "batches") {
            const k = (x) =>
                [x.lot || "", x.expiry || "", x.loc || ""].join("|"),
              M = new Map(m.map((x) => [k(x), x])),
              T = new Map(t.map((x) => [k(x), x])),
              Bm = new Map(bb.map((x) => [k(x), x]));
            const out = [];
            for (const [kk, tv] of T) {
              if (M.has(kk))
                out.push(
                  svMerge3(
                    Bm.get(kk) || { qty: 0 },
                    M.get(kk),
                    tv,
                    null,
                    "batches",
                    st,
                  ),
                );
              else if (!Bm.has(kk)) out.push(tv);
              else if (!jeq(Bm.get(kk), tv)) {
                const q = Math.round((tv.qty - Bm.get(kk).qty) * 1000) / 1000;
                if (q > 0) out.push({ ...tv, qty: q });
              }
            } // eu consumi o lote inteiro: sobra só o que o outro lado acrescentou
            for (const [kk, mv] of M)
              if (!T.has(kk)) {
                if (!Bm.has(kk)) out.push(mv);
                else if (!jeq(Bm.get(kk), mv)) {
                  const q = Math.round((mv.qty - Bm.get(kk).qty) * 1000) / 1000;
                  if (q > 0) out.push({ ...mv, qty: q });
                }
              }
            return out.filter((x) => !(x.qty <= 0.0000001));
          }
          if (hasIds(m) && hasIds(t) && (bb.length === 0 || hasIds(bb))) {
            const M = new Map(m.map((x) => [x.id, x])),
              T = new Map(t.map((x) => [x.id, x])),
              Bm = new Map(bb.map((x) => [x.id, x])),
              out = [];
            for (const [id, tv] of T) {
              if (M.has(id))
                out.push(svMerge3(Bm.get(id), M.get(id), tv, null, key, st));
              else if (!Bm.has(id))
                out.push(tv); // novo do outro lado
              else if (!jeq(Bm.get(id), tv)) {
                out.push(tv);
                st.c++;
              } // eu apaguei, o outro alterou: fica a alteração
            }
            for (const [id, mv] of M)
              if (!T.has(id)) {
                if (!Bm.has(id)) out.push(mv);
                else if (!jeq(Bm.get(id), mv)) {
                  out.push(mv);
                  st.c++;
                }
              } // novo meu, ou eu alterei o que o outro apagou
            return out;
          }
          // listas sem id (categorias, locais, registro de atividades): une o que cada lado acrescentou ou removeu
          const k = (x) => (typeof x === "string" ? x : JSON.stringify(x)),
            Bs = new Set(bb.map(k)),
            Ms = new Set(m.map(k)),
            Ts = new Set(t.map(k));
          const out = t.filter((x) => Ms.has(k(x)) || !Bs.has(k(x))); // fica o que eu não removi
          for (const x of m) if (!Ts.has(k(x)) && !Bs.has(k(x))) out.push(x); // acrescenta o que eu criei
          return out;
        }
        if (isObj(m) && isObj(t)) {
          const bb = isObj(b) ? b : {},
            out = {};
          for (const k of new Set([...Object.keys(t), ...Object.keys(m)])) {
            const inM = k in m,
              inT = k in t,
              inB = k in bb;
            if (inM && inT) out[k] = svMerge3(bb[k], m[k], t[k], k, key, st);
            else if (inM) {
              if (!inB || !jeq(bb[k], m[k])) out[k] = m[k];
            } // criado ou alterado por mim
            else if (inT) {
              if (!inB || !jeq(bb[k], t[k])) out[k] = t[k];
            } // criado ou alterado pelo outro
          }
          return out;
        }
        st.c++;
        return m; // mesmo campo alterado dos dois lados: vale o mais recente (o meu)
      }
      function svMergeTop(b, m, t) {
        const st = { c: 0 },
          r = svMerge3(b || {}, m, t, null, null, st);
        SV.conflicts += st.c;
        return r;
      }

      /* ---------- cópia local, envio e recebimento ---------- */
      const svKeys = (cid) => ({
        db: "giro_db_" + cid,
        base: "giro_base_" + cid,
        rev: "giro_rev_" + cid,
        dirty: "giro_dirty_" + cid,
      });
      function svMarkDirty() {
        if (!SV.on || !CO || CO.id === "demo") return;
        SV.dirty = true;
        svLS.set(svKeys(CO.id).dirty, "1");
        clearTimeout(SV.timer);
        SV.timer = setTimeout(svPush, 350);
        svStatus();
      }
      function svStatus() {
        const e = $("#syncT");
        if (!e) return;
        const d = e.parentNode && e.parentNode.querySelector(".dot");
        let t,
          c = "";
        if (!SV.on) {
          return;
        }
        if (SV.blocked) {
          t = "Somente leitura: mudanças não salvas";
          c = "var(--r)";
        } else if (SV.offline && SV.dirty) {
          t = "Sem conexão, mudanças guardadas neste aparelho";
          c = "#e0a800";
        } else if (SV.offline) {
          t = "Sem conexão";
          c = "#e0a800";
        } else if (SV.busy || SV.dirty) {
          t = "Salvando...";
          c = "#e0a800";
        } else {
          t =
            "Salvo no servidor " +
            new Date(SV.lastOk || Date.now()).toLocaleTimeString("pt-BR");
          c = "var(--ok)";
        }
        e.textContent = t;
        if (d) d.style.background = c;
      }
      async function svPush() {
        if (!SV.on || !CO || CO.id === "demo" || SV.busy || !SV.dirty) return;
        SV.busy = true;
        svStatus();
        try {
          for (let i = 0; i < 4 && SV.dirty; i++) {
            const K = svKeys(CO.id);
            SV.dirty = false;
            svLS.set(K.dirty, "");
            const mine = svLS.get(K.db);
            let data;
            try {
              data = JSON.parse(mine);
            } catch (e) {
              return;
            }
            const r = await api("PUT", "/api/data", { baseRev: SV.rev, data });
            if (r.ok) {
              SV.rev = r.data.rev;
              SV.base = mine;
              svLS.set(K.base, mine);
              svLS.set(K.rev, String(SV.rev));
              SV.lastOk = Date.now();
              SV.blocked = "";
              continue;
            }
            if (r.status === 409) {
              const theirs = r.data.data,
                cur = JSON.stringify(theirs);
              let merged;
              if (SV.force) {
                merged = data;
                SV.force = false;
              } else {
                try {
                  merged = svMergeTop(
                    SV.base ? JSON.parse(SV.base) : null,
                    data,
                    theirs,
                  );
                } catch (e) {
                  merged = theirs;
                }
              }
              svLS.set(K.db, JSON.stringify(merged));
              SV.rev = r.data.rev;
              SV.base = cur;
              svLS.set(K.base, cur);
              svLS.set(K.rev, String(SV.rev));
              SV.dirty = true;
              svLS.set(K.dirty, "1");
              if (SV.conflicts) {
                toast(
                  "Outra pessoa alterou os mesmos dados ao mesmo tempo. Juntamos as duas mudanças; confira o estoque.",
                  1,
                );
                SV.conflicts = 0;
              }
              load();
              if (mode === "app") svRerender();
              continue;
            }
            if (r.status === 402) {
              SV.blocked = (r.data && r.data.error) || "somente leitura";
              SV.dirty = true;
              svLS.set(K.dirty, "1");
              await svSyncNow();
              break;
            }
            if (r.status === 401) {
              SV.dirty = true;
              svLS.set(K.dirty, "1");
              svSessionLost();
              break;
            }
            // erro de rede ou do servidor: mantém pendente e tenta de novo
            SV.dirty = true;
            svLS.set(K.dirty, "1");
            setTimeout(svPush, r.offline ? 8000 : 15000);
            break;
          }
        } finally {
          SV.busy = false;
          svStatus();
        }
      }
      function svRerender() {
        if (mode !== "app") return;
        const m = $("#modal");
        if (m && m.classList.contains("open")) return;
        const a = document.activeElement;
        if (
          a &&
          /INPUT|TEXTAREA|SELECT/.test(a.tagName) &&
          $("#view") &&
          $("#view").contains(a)
        )
          return;
        render();
      }
      function svSessionLost() {
        SV.stopPoll();
        PLAT.session = null;
        mode = "public";
        db = null;
        CO = null;
        location.hash = "#/entrar";
        enter().then(() =>
          toast(
            "Sua sessão expirou. Entre de novo: o que não foi salvo está guardado neste aparelho.",
            1,
          ),
        );
      }
      SV.stopPoll = () => {
        clearInterval(SV.poll);
        SV.poll = null;
      };
      SV.startPoll = () => {
        SV.stopPoll();
        SV.poll = setInterval(() => {
          if (!document.hidden) svSyncNow();
        }, 5000);
      };

      // traz do servidor a assinatura, os usuários e, se mudou, os dados
      async function svSyncNow() {
        if (!SV.on || !CO || CO.id === "demo" || !acct()) return;
        const r = await api("GET", "/api/sync?rev=" + SV.rev);
        if (r.status === 401) {
          svSessionLost();
          return;
        }
        if (!r.ok) {
          svStatus();
          return;
        }
        const d = r.data;
        SV.skew = d.serverNow - Date.now();
        const was = JSON.stringify(
          PLAT.companies[0] && PLAT.companies[0].state,
        );
        SV.withdraw = d.withdraw || null;
        svApplyCompany(d.company, d.invoices, d.members, d.usage);
        refresh();
        if (d.changed && !SV.dirty && !SV.busy) {
          const g = await api("GET", "/api/data");
          if (g.ok && g.data.data) {
            const K = svKeys(CO.id),
              s = JSON.stringify(g.data.data);
            svLS.set(K.db, s);
            svLS.set(K.base, s);
            svLS.set(K.rev, String(g.data.rev));
            SV.rev = g.data.rev;
            SV.base = s;
            SV.lastOk = Date.now();
            load();
            svRerender();
          }
        } else if (SV.dirty && !SV.busy && !SV.blocked) svPush();
        else if (
          JSON.stringify(PLAT.companies[0] && PLAT.companies[0].state) !== was
        )
          svRerender();
        if (SV.blocked && !(PLAT.companies[0].state || {}).rw) {
          SV.blocked = "";
          svPush();
        }
        if (SV.awaitPay && CO && subInfo(CO).st === "ativa") {
          SV.awaitPay = false;
          closeModal();
          svRerender();
          toast("Pagamento confirmado. Obrigado!");
        }
        svStatus();
      }
      function svApplyCompany(c, invoices, members, usage) {
        const o = PLAT.companies[0] || {};
        PLAT.companies = [
          {
            id: c.id,
            name: c.name,
            segment: c.segment,
            createdAt: c.createdAt,
            suspended: c.suspended,
            suspendReason: c.suspendReason,
            sub: c.sub,
            state: c.state,
            invoices: (invoices || []).map((i) => ({
              id: i.id,
              ts: i.ts,
              plan: i.plan,
              cycle: i.cycle,
              amount: i.amount,
              status: i.status,
              url: i.url,
              due: i.due,
              addons: i.addons,
            })),
          },
        ];
        if (
          c.name &&
          db &&
          db.company &&
          db.company.name !== c.name &&
          !db.demo
        ) {
        }
        const me = PLAT.session && PLAT.session.accountId;
        PLAT.accounts = (members || []).map((m) => ({
          id: m.id,
          email: m.email,
          name: m.name,
          role: m.role,
          mustChange: m.mustChange,
          companyId: c.id,
        }));
        if (!PLAT.accounts.some((a) => a.id === me) && SV.me)
          PLAT.accounts.push({ ...SV.me, companyId: c.id });
        if (usage) SV.usage[c.id] = usage;
        CO = PLAT.companies[0];
      }

      /* ---------- entrada no servidor ---------- */
      function svBlankPlat() {
        return {
          v: 4,
          accounts: [],
          companies: [],
          audit: [],
          errors: [],
          coupons: [],
          settings: { trialDays: 14, graceDays: 7, annualMonthsFree: 2 },
          plans: defPlans(),
          session: null,
        };
      }
      async function svInit() {
        if (SV.checked) return;
        SV.checked = true;
        if (!/^https?:$/.test(location.protocol)) return;
        try {
          const r = await fetch("/api/health", { credentials: "same-origin" });
          const j = await r.json();
          if (r.ok && j.giro === 1) SV.on = true;
        } catch (e) {}
        if (!SV.on) return;
        PLAT = svBlankPlat();
        const c = await api("GET", "/api/config");
        if (c.ok) {
          SV.cfg = c.data;
          PLAT.plans = c.data.plans;
          PLAT.addons = c.data.addons;
          PLAT.settings = c.data.settings;
          SV.skew = c.data.serverNow - Date.now();
        }
        await svBoot();
      }
      // carrega a sessão (se houver) e os dados da empresa
      async function svBoot() {
        const r = await api("GET", "/api/me");
        if (r.status === 401 || !r.ok) {
          PLAT.session = null;
          PLAT.companies = [];
          PLAT.accounts = [];
          return r.status === 0 ? "offline" : "anon";
        }
        const m = r.data;
        SV.me = {
          id: m.account.id,
          email: m.account.email,
          name: m.account.name,
          role: m.account.role,
          mustChange: m.account.mustChange,
        };
        PLAT.plans = m.plans;
        PLAT.addons = m.addons;
        PLAT.settings = m.settings;
        SV.skew = m.serverNow - Date.now();
        SV.billing = m.billing;
        PLAT.session = { accountId: m.account.id, ts: Date.now() };
        SV.withdraw = m.withdraw || null;
        svApplyCompany(m.company, m.invoices, m.members, m.usage);
        // outras empresas guardadas neste aparelho não ficam: troca de usuário no mesmo computador não vaza dados
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const k = localStorage.key(i);
          if (
            /^giro_(db|base|rev|dirty)_/.test(k) &&
            !k.endsWith("_demo") &&
            !k.endsWith("_" + m.company.id)
          )
            svLS.del(k);
        }
        KEY = "giro_db_" + m.company.id;
        const K = svKeys(m.company.id);
        const dirty = svLS.get(K.dirty) === "1",
          localBase = svLS.get(K.base);
        const g = await api("GET", "/api/data");
        if (!g.ok) {
          return "offline";
        }
        SV.rev = g.data.rev;
        SV.serverEmpty = !g.data.data;
        if (g.data.data) {
          const theirs = JSON.stringify(g.data.data);
          if (dirty && svLS.get(K.db)) {
            // sobrou algo não enviado: junta com o que está no servidor
            let merged;
            try {
              merged = svMergeTop(
                localBase ? JSON.parse(localBase) : null,
                JSON.parse(svLS.get(K.db)),
                g.data.data,
              );
            } catch (e) {
              merged = g.data.data;
            }
            svLS.set(K.db, JSON.stringify(merged));
            SV.dirty = true;
          } else svLS.set(K.db, theirs);
          svLS.set(K.base, theirs);
          svLS.set(K.rev, String(SV.rev));
          SV.base = theirs;
        } else if (dirty && svLS.get(K.db)) {
          SV.dirty = true;
          SV.base = null;
        } else svLS.del(K.db);
        SV.lastOk = Date.now();
        SV.startPoll();
        return "ok";
      }
      async function svLogout() {
        if (SV.dirty && CO && CO.id !== "demo") {
          await svPush();
        }
        if (
          SV.dirty &&
          !confirm(
            "Há mudanças que ainda não chegaram ao servidor. Sair mesmo assim? Elas serão perdidas.",
          )
        )
          return false;
        SV.stopPoll();
        clearTimeout(SV.timer);
        await api("POST", "/api/auth/logout", {});
        if (CO) {
          const K = svKeys(CO.id);
          Object.values(K).forEach((k) => svLS.del(k));
        }
        SV.dirty = false;
        SV.rev = 0;
        SV.base = null;
        SV.me = null;
        PLAT.session = null;
        PLAT.companies = [];
        PLAT.accounts = [];
        return true;
      }
      window.addEventListener("online", () => {
        if (SV.on) {
          SV.offline = false;
          svSyncNow();
          svPush();
        }
      });
      if (document.addEventListener)
        document.addEventListener("visibilitychange", () => {
          if (SV.on && !document.hidden) svSyncNow();
        });
      window.addEventListener("beforeunload", (e) => {
        if (SV.on && SV.dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });

      /* ---------- painel da plataforma (operador) ---------- */
      async function svPlatLoad() {
        const r = await api("GET", "/api/platform/overview");

          return false;
        }
        const d = r.data;
        SV.skew = d.serverNow - Date.now();
        PLAT.plans = d.plans;
        PLAT.addons = d.addons || PLAT.addons;
        PLAT.settings = d.settings;
        PLAT.coupons = d.coupons;
        SV.billing = d.billing;
        SV.refunds = d.refunds || [];
        PLAT.companies = d.companies.map((c) => ({
          id: c.id,
          name: c.name,
          segment: c.segment,
          createdAt: c.createdAt,
          suspended: c.suspended,
          suspendReason: c.suspendReason,
          sub: c.sub,
          ownerEmail: c.ownerEmail,
          invoices: c.invoices,
        }));
        d.companies.forEach((c) => {
          SV.usage[c.id] = c.usage;
        });
        PLAT.audit = d.audit;
        PLAT.errors = d.errors;
        PLAT.accounts = [
          {
            id: "platform",
            email: "plataforma",
            name: "Operador Giro",
            platform: true,
          },
        ];
        PLAT.session = { accountId: "platform", ts: Date.now() };
        SV.platOk = true;
        return true;
      }

      /* emoji -> nome do ícone. Emoji de status colorido vira ponto; o resto vira ícone. */

      };
      const DOT = { "🔴": "dotc", "🟠": "dotc a" };
      const svgI = (n) =>
        '<span class="i" aria-hidden="true"><svg viewBox="0 0 24 24">' +
        IC[n] +
        "</svg></span>";
      const EMO_RE = new RegExp(
        "[" + Object.keys(EMO).concat(Object.keys(DOT)).join("") + "]️?",
        "gu",
      );
      function iconize(root) {
        const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode: (n) => {
            const t = n.parentNode && n.parentNode.nodeName;
            return t === "SCRIPT" || t === "STYLE" || t === "TEXTAREA"
              ? NodeFilter.FILTER_REJECT
              : ((EMO_RE.lastIndex = 0),
                EMO_RE.test(n.nodeValue)
                  ? NodeFilter.FILTER_ACCEPT
                  : NodeFilter.FILTER_SKIP);
          },
        });
        const L = [];
        while (w.nextNode()) L.push(w.currentNode);
        L.forEach((n) => {
          const par = n.parentNode;
          if (!par) return;
          if (par.nodeName === "OPTION" || par.nodeName === "TITLE") {
            n.nodeValue = n.nodeValue.replace(EMO_RE, "").replace(/^\s+/, "");
            return;
          }
          const h = esc(n.nodeValue).replace(EMO_RE, (m) => {
            const c = m.replace("️", "");
            return DOT[c]
              ? '<span class="' + DOT[c] + '"></span>'
              : svgI(EMO[c]);
          });
          const s = document.createElement("span");
          s.style.display = "contents";
          s.innerHTML = h;
          par.replaceChild(s, n);
        });
      }
      const stripEmo = (s) => String(s).replace(EMO_RE, "").replace(/^\s+/, "");
      let _iz = 0;
      const _mo =
        typeof MutationObserver !== "undefined"
          ? new MutationObserver(() => {
              if (_iz) return;
              _iz = 1;
              requestAnimationFrame(() => {
                _iz = 0;
                _mo.disconnect();
                try {
                  iconize(document.body);
                } finally {
                  _mo.observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true,
                  });
                }
              });
            })
          : null;
      if (_mo)
        document.addEventListener("DOMContentLoaded", () => {
          iconize(document.body);
          _mo.observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true,
          });
        });
      enter();
