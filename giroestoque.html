<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1740c8" />
    <title>Giro | Vendeu. Baixou. Lucrou. Girou.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --g: #1740c8;
        --gd: #0f2f9c;
        --gl: #e3e9fb;
        --y: #ffd60a;
        --yl: #fff4b8;
        --bg: #eef1f2;
        --card: #ffffff;
        --tx: #18202e;
        --mu: #566174;
        --bd: #d3d9de;
        --r: #c0261b;
        --rl: #fbe0dd;
        --a: #8a5a00;
        --al: #fff0bf;
        --ok: #12805c;
        --okl: #d9f1e8;
        --rad: 8px;
        --sans:
          "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --cond: "Barlow Condensed", "Barlow", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: var(--sans);
        background: var(--bg);
        color: var(--tx);
        font-size: 17px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--g);
      }
      :focus-visible {
        outline: 3px solid var(--y);
        outline-offset: 2px;
        box-shadow: 0 0 0 5px var(--g);
      }
      .i {
        display: inline-block;
        width: 1.15em;
        height: 1.15em;
        vertical-align: -0.22em;
        flex: none;
      }
      .i svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dotc {
        display: inline-block;
        width: 0.7em;
        height: 0.7em;
        border-radius: 50%;
        background: var(--r);
        margin-right: 0.15em;
      }
      .dotc.a {
        background: #e0a800;
      }
      /* painel e IA */
      .pnv {
        --s1: #2a78d6;
        --ref: #6b7585;
        --grid: #e3e7ec;
        position: relative;
      }
      .pnv h2 {
        font-size: 18px;
        margin: 16px 0 4px;
      }
      .pnsvg {
        display: block;
        max-width: 100%;
        height: auto;
        touch-action: pan-y;
        overflow: visible;
      }
      .pnsvg .gl {
        stroke: var(--grid);
        stroke-width: 1;
      }
      .pnsvg .gl.base {
        stroke: #aeb7c2;
      }
      .pnsvg .ax {
        fill: var(--mu);
        font-size: 12px;
      }
      .pnsvg .ax.lab {
        fill: var(--tx);
        font-size: 13px;
      }
      .pnsvg .val {
        fill: var(--tx);
        font-size: 13px;
        font-weight: 600;
      }
      .pnsvg .dlab {
        fill: var(--tx);
        font-size: 12px;
        font-weight: 600;
        stroke: #fff;
        stroke-width: 3.5;
        paint-order: stroke;
      }
      .pnsvg .val {
        stroke: #fff;
        stroke-width: 3;
        paint-order: stroke;
      }
      .pnsvg .lc {
        fill: none;
        stroke: var(--s1);
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .pnsvg .lp {
        fill: none;
        stroke: var(--ref);
        stroke-width: 2;
        stroke-dasharray: 6 5;
        stroke-linejoin: round;
      }
      .pnsvg .ar {
        fill: var(--s1);
        opacity: 0.1;
      }
      .pnsvg .bar {
        fill: var(--s1);
      }
      .pnsvg .prv {
        stroke: var(--ref);
        stroke-width: 2.5;
      }
      .pnsvg .pt {
        fill: var(--s1);
      }
      .pnsvg .cx {
        stroke: #8a93a3;
        stroke-width: 1;
      }
      .pnsvg .dc {
        fill: var(--s1);
        stroke: #fff;
        stroke-width: 2;
      }
      .pnsvg .dp {
        fill: var(--ref);
        stroke: #fff;
        stroke-width: 2;
      }
      .pnsvg .hit {
        cursor: crosshair;
      }
      .lg {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 14px;
        color: var(--mu);
        margin: 2px 0 6px;
      }
      .lg .sw,
      .pntip .sw {
        display: inline-block;
        width: 18px;
        height: 0;
        border-top: 3px solid var(--s1);
        margin-right: 6px;
        vertical-align: middle;
      }
      .sw.c {
        border-top-color: var(--s1);
      }
      .sw.p {
        border-top: 3px dashed var(--ref) !important;
      }
      .sw.b {
        height: 10px !important;
        width: 14px !important;
        background: var(--s1);
        border: 0 !important;
        border-radius: 3px 3px 0 0;
      }
      .sw.m {
        height: 14px !important;
        width: 0 !important;
        border-top: 0 !important;
        border-left: 3px solid var(--ref);
        margin-right: 8px !important;
      }
      .pntip {
        position: absolute;
        z-index: 5;
        pointer-events: none;
        background: #18202e;
        color: #fff;
        border-radius: 8px;
        padding: 8px 11px;
        font-size: 14px;
        line-height: 1.4;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        max-width: 260px;
      }
      .pntip .sw {
        border-top-color: #9db8f0;
      }
      .pntip .sw.p {
        border-top-color: #c3c9d4 !important;
      }
      .dl {
        font-size: 14px;
        color: var(--mu);
      }
      .dl.g {
        color: var(--ok);
      }
      .dl.b {
        color: var(--r);
      }
      .dl i {
        font-style: normal;
      }
      .pntip .dl,
      .pntip .dl.g,
      .pntip .dl.b {
        color: #fff;
      }
      .kpi.pk {
        cursor: default;
      }
      .grid > * {
        min-width: 0;
      }
      .kpi.pk div {
        font-size: 26px;
        overflow-wrap: anywhere;
      }
      @media (min-width: 700px) {
        .kpi.pk div {
          font-size: 32px;
        }
      }
      .kpi.pk small + div + small {
        display: block;
      }
      .seg {
        display: flex;
        border: 1.5px solid var(--g);
        border-radius: 8px;
        overflow: hidden;
        margin: 10px 0;
      }
      .seg button {
        flex: 1;
        border: 0;
        background: #fff;
        padding: 9px;
        font-weight: 600;
        color: var(--g);
        cursor: pointer;
      }
      .seg button.on {
        background: var(--g);
        color: #fff;
      }
      .chip.on {
        background: var(--g);
        border-color: var(--g);
        color: #fff;
      }
      .inl {
        display: inline;
        font-size: inherit;
        font-weight: 400;
      }
      .inl input {
        width: auto;
        min-height: 0;
        vertical-align: middle;
      }
      .ins {
        border-left: 5px solid var(--bd);
      }
      .ins.sr {
        border-left-color: var(--r);
      }
      .ins.sa {
        border-left-color: #e0a800;
      }
      .ins.si {
        border-left-color: var(--g);
      }
      .ins p {
        margin: 4px 0 10px;
        color: var(--tx);
      }
      .ailog {
        max-height: 340px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }
      .aiq {
        align-self: flex-end;
        background: var(--g);
        color: #fff;
        border-radius: 12px 12px 2px 12px;
        padding: 8px 12px;
        max-width: 88%;
      }
      .aia {
        align-self: flex-start;
        background: var(--gl);
        border-radius: 12px 12px 12px 2px;
        padding: 9px 13px;
        max-width: 96%;
      }
      .aia ol {
        margin: 6px 0 6px 18px;
        padding: 0;
      }
      .aia .btn {
        margin-top: 6px;
      }
      .gsfake {
        width: 100%;
        text-align: left;
        background: #fff;
        border: 2px solid var(--g);
        color: var(--mu);
        border-radius: 8px;
        min-height: 50px;
        padding: 0 14px;
        margin-bottom: 10px;
        font-size: 17px;
        cursor: text;
      }
      @media print {
        .hsearch,
        .seg,
        .chips {
          display: none;
        }
      }
      /* busca global e autopreenchimento */
      .hsearch {
        background: var(--gl);
        border: 1.5px solid var(--g);
        color: var(--g);
        border-radius: 8px;
        min-width: 44px;
        min-height: 40px;
        font-size: 18px;
        cursor: pointer;
        margin-right: 8px;
      }
      .hsearch:hover {
        background: #d3dcf8;
      }
      .gs .gsin {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 2px solid var(--g);
        border-radius: 8px;
        padding: 2px 12px;
        background: #fff;
      }
      .gs .gsin:focus-within {
        box-shadow: 0 0 0 4px var(--yl);
      }
      .gs .gsin input:focus-visible {
        outline: 0;
        box-shadow: none;
      }
      .gs .gsin input {
        border: 0;
        outline: 0;
        flex: 1;
        min-height: 46px;
        font-size: 18px;
        background: transparent;
      }
      #gs_l {
        max-height: 55vh;
        overflow: auto;
        margin-top: 8px;
      }
      .gsg {
        font-size: 13px;
        font-weight: 600;
        color: var(--mu);
        padding: 10px 4px 3px;
      }
      .gsr {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 9px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .gsr.on {
        background: var(--gl);
        box-shadow: inset 3px 0 0 var(--g);
      }
      .gsr .gsi {
        width: 30px;
        text-align: center;
        font-size: 20px;
      }
      .gsr .t {
        flex: 1;
        min-width: 0;
      }
      .gsr .t b {
        display: block;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gsr .t small {
        color: var(--mu);
        font-size: 14px;
      }
      .gs mark {
        background: var(--yl);
        color: inherit;
        border-radius: 2px;
        padding: 0 1px;
      }
      .gshint {
        font-size: 13px;
        margin: 10px 0 0;
      }
      .auto {
        background: var(--gl);
        border-radius: 8px;
        padding: 8px 12px;
        margin: 6px 0;
        font-size: 15px;
      }
      .auto.ok {
        background: var(--okl);
      }
      .autofilled {
        background: var(--yl) !important;
      }
      /* marca */
      .logo {
        font-family: var(--cond);
        font-weight: 800;
        letter-spacing: -0.01em;
        font-size: 30px;
        line-height: 1;
        color: var(--g);
        display: inline-flex;
        align-items: center;
      }
      .logo b {
        font-weight: 800;
      }
      .wm-o {
        width: 0.8em;
        height: 0.8em;
        margin-left: 0.05em;
        transform: translateY(0.05em);
        overflow: visible;
        fill: none;
        cursor: pointer;
      }
      .wm-o .rg {
        stroke: var(--y);
        stroke-width: 2.6;
        stroke-dasharray: 100;
        stroke-dashoffset: 0;
      }
      .wm-o .fl {
        fill: var(--y);
        stroke: none;
        transform-origin: 12px 12px;
      }
      .wm-o .ck {
        stroke: var(--g);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 0;
      }
      .logo.inv .wm-o .ck {
        stroke: #0d3b2e;
      }
      /* o "o" é uma caixa de seleção que se marca: o anel fecha, o fundo enche e o visto é desenhado */
      .wm-o.go .rg {
        animation: woRing 0.55s cubic-bezier(0.5, 0, 0.2, 1) both;
      }
      .wm-o.go .fl {
        animation: woFill 0.3s 0.5s ease-out both;
      }
      .wm-o.go .ck {
        animation: woCk 0.38s 0.72s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      .wm-o.go {
        animation: woPop 0.34s 1s ease-out;
      }
      .wm-o.go.q .rg {
        animation: none;
      }
      .wm-o.go.q .fl {
        animation: none;
      }
      .wm-o.go.q .ck {
        animation: woCk 0.35s both;
      }
      .wm-o.go.q {
        animation: woPop 0.3s 0.3s ease-out;
      }
      @keyframes woRing {
        from {
          stroke-dashoffset: 100;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes woFill {
        from {
          transform: scale(0);
        }
        to {
          transform: scale(1);
        }
      }
      @keyframes woCk {
        from {
          stroke-dashoffset: 100;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes woPop {
        50% {
          transform: translateY(0.05em) scale(1.18);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .wm-o.go,
        .wm-o.go * {
          animation: none !important;
        }
      }
      .logo.inv {
        color: #fff;
      }
      /* estrutura do app */
      #shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #fff;
        border-bottom: 3px solid var(--g);
        padding: 9px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header .sp {
        flex: 1;
      }
      .sync {
        font-size: 13px;
        color: var(--mu);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
      }
      .who {
        font-size: 14px;
        font-weight: 600;
        background: var(--bg);
        border-radius: 20px;
        padding: 6px 13px;
        cursor: pointer;
        max-width: 50vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hco {
        font-size: 14px;
        color: var(--mu);
        max-width: 30vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .app-brand {
        flex: none;
        padding-right: 12px;
        border-right: 2px solid var(--y);
        font-size: 36px;
      }
      .more-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .more-card {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 70px;
        padding: 12px 14px;
        border: 1px solid var(--bd);
        border-radius: var(--rad);
        background: #fff;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }
      .more-card:hover {
        border-color: var(--g);
        background: #f8faff;
      }
      .more-icon {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        flex: none;
        border-radius: 6px;
        background: var(--gl);
        font-size: 21px;
      }
      .more-title {
        flex: 1;
        min-width: 0;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.2;
      }
      .more-action {
        flex: none;
        color: var(--mu);
        font-size: 18px;
      }
      @media (max-width: 600px) {
        .more-grid {
          grid-template-columns: 1fr;
        }
        .app-brand {
          padding-right: 8px;
          font-size: 32px;
        }
      }
      main {
        flex: 1;
        padding: 18px 16px;
        padding-bottom: 104px;
        max-width: 1000px;
        width: 100%;
        margin: 0 auto;
      }
      nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 1px solid var(--bd);
        display: flex;
        z-index: 30;
      }
      nav a {
        flex: 1;
        text-align: center;
        padding: 9px 2px 10px;
        text-decoration: none;
        color: var(--mu);
        font-size: 13px;
        font-weight: 600;
        border-top: 3px solid transparent;
        margin-top: -1px;
      }
      nav a span {
        display: block;
        font-size: 24px;
        line-height: 1;
      }
      nav a span .i {
        width: 1em;
        height: 1em;
        vertical-align: 0;
      }
      nav a.on {
        color: var(--g);
        border-top-color: var(--y);
      }
      .nav-toggle {
        display: none;
      }
      @media (min-width: 900px) {
        nav {
          top: 0;
          bottom: 0;
          right: auto;
          width: 92px;
          flex-direction: column;
          justify-content: flex-start;
          padding: 74px 8px 12px;
          border-top: 0;
          background: var(--g);
          border-right: 0;
          transition: width 0.18s ease;
        }
        nav a {
          flex: none;
          display: flex;
          align-items: center;
          gap: 14px;
          min-height: 48px;
          color: #c9d4f7;
          border-top: 0;
          border-left: 4px solid transparent;
          border-radius: 4px;
          padding: 10px 14px;
          margin: 0;
          white-space: nowrap;
          overflow: hidden;
        }
        nav a > span {
          display: grid;
          place-items: center;
          width: 22px;
          flex: none;
          font-size: 22px;
        }
        nav a.on {
          color: #fff;
          border-left-color: var(--y);
          background: rgba(255, 255, 255, 0.1);
        }
        nav .nav-label {
          width: 0;
          overflow: hidden;
          opacity: 0;
          transition: opacity 0.12s ease;
        }
        nav .nav-toggle {
          position: absolute;
          top: 14px;
          left: 22px;
          display: grid;
          place-items: center;
          width: 44px;
          height: 44px;
          border: 0;
          border-radius: 4px;
          background: transparent;
          color: #fff;
          font-size: 22px;
          cursor: pointer;
        }
        nav .nav-toggle:hover {
          background: rgba(255, 255, 255, 0.12);
        }
        #shell {
          padding-left: 92px;
          transition: padding-left 0.18s ease;
        }
        header {
          margin-left: -92px;
          padding-left: 108px;
          transition:
            margin-left 0.18s ease,
            padding-left 0.18s ease;
        }
        #shell.nav-expanded {
          padding-left: 220px;
        }
        #shell.nav-expanded header {
          margin-left: -220px;
          padding-left: 236px;
        }
        #nav.nav-expanded {
          width: 220px;
        }
        #nav.nav-expanded .nav-label {
          width: auto;
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        nav,
        nav .nav-label,
        #shell,
        header {
          transition: none !important;
        }
      }
      h1 {
        font-family: var(--cond);
        font-weight: 700;
        font-size: 30px;
        line-height: 1.05;
        margin: 4px 0 14px;
        letter-spacing: -0.005em;
      }
      h2 {
        font-family: var(--cond);
        font-weight: 700;
        font-size: 22px;
        line-height: 1.1;
        margin: 24px 0 10px;
      }
      /* superfícies */
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--rad);
        padding: 15px;
        margin-bottom: 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      @media (min-width: 700px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .kpi {
        background: #fff;
        border: 1px solid var(--bd);
        border-top: 4px solid var(--bd);
        border-radius: var(--rad);
        padding: 12px 14px 14px;
        cursor: pointer;
      }
      .kpi small {
        color: var(--mu);
        font-size: 14px;
        font-weight: 500;
      }
      .kpi div {
        font-family: var(--cond);
        font-weight: 700;
        font-size: 40px;
        line-height: 1.05;
        margin-top: 2px;
      }
      .kpi.red {
        border-top-color: var(--r);
      }
      .kpi.red div {
        color: var(--r);
      }
      .kpi.amb {
        border-top-color: #e0a800;
      }
      .kpi.amb div {
        color: var(--a);
      }
      .kpi.grn {
        border-top-color: var(--ok);
      }
      .kpi.grn div {
        color: var(--ok);
      }
      /* botões */
      .btn {
        border: 0;
        border-radius: 4px;
        padding: 13px 18px;
        font-weight: 700;
        background: var(--g);
        color: #fff;
        cursor: pointer;
        font-size: 17px;
        min-height: 48px;
        transition: background 0.12s;
      }
      .btn:hover {
        background: var(--gd);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.ghost {
        background: #fff;
        color: var(--tx);
        border: 1.5px solid #aeb7c2;
      }
      .btn.ghost:hover {
        background: var(--bg);
      }
      .btn.red {
        background: var(--r);
      }
      .btn.red:hover {
        background: #9b1d14;
      }
      .btn.amb {
        background: var(--y);
        color: var(--tx);
      }
      .btn.amb:hover {
        background: #f0c800;
      }
      .btn.sm {
        padding: 7px 12px;
        min-height: 36px;
        font-size: 15px;
      }
      .btn.full {
        width: 100%;
      }
      .btn.lg {
        padding: 15px 26px;
        font-size: 19px;
        min-height: 54px;
      }
      .btn:disabled {
        cursor: not-allowed;
      }
      .quick {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      @media (min-width: 700px) {
        .quick {
          grid-template-columns: repeat(5, 1fr);
        }
      }
      .quick .btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        padding: 14px 6px;
        font-size: 15px;
      }
      .quick .btn i {
        font-style: normal;
        font-size: 26px;
        line-height: 1;
      }
      .quick .btn i .i {
        width: 1em;
        height: 1em;
        vertical-align: 0;
      }
      .dash-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(270px, 0.7fr);
        gap: 10px;
        margin: 6px 0 16px;
      }
      .dash-welcome,
      .dash-cash {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 18px 20px;
        border: 1px solid var(--bd);
        border-radius: var(--rad);
        background: #fff;
      }
      .dash-welcome {
        display: block;
        border-left: 5px solid var(--g);
      }
      .dash-eyebrow,
      .dash-cash small {
        display: block;
        color: var(--mu);
        font-size: 12px;
        font-weight: 700;
      }
      .dash-welcome h1 {
        margin: 5px 0;
        font-size: 34px;
      }
      .dash-welcome p,
      .dash-cash span {
        margin: 0;
        color: var(--mu);
        font-size: 14px;
      }
      .dash-segment {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }
      .dash-segment p {
        flex: 1;
        min-width: 0;
      }
      .dash-segment-icon {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex: none;
        border-radius: 50%;
        background: var(--gl);
        color: var(--g);
        font-size: 18px;
      }
      .dash-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .dash-cash {
        border-left: 5px solid var(--y);
      }
      .dash-cash.is-open {
        border-left-color: var(--ok);
      }
      .dash-cash strong {
        display: block;
        margin: 2px 0;
        font-family: var(--cond);
        font-size: 24px;
        line-height: 1.1;
      }
      @media (max-width: 700px) {
        .dash-hero {
          grid-template-columns: 1fr;
        }
        .dash-welcome h1 {
          font-size: 30px;
        }
      }
      /* campos */
      input,
      select,
      textarea {
        width: 100%;
        border: 1.5px solid #aeb7c2;
        border-radius: 4px;
        padding: 11px 12px;
        background: #fff;
        min-height: 48px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 0;
        border-color: var(--g);
        box-shadow: 0 0 0 3px var(--gl);
      }
      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--mu);
        margin: 13px 0 4px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .row > * {
        flex: 1;
      }
      .row > .fit {
        flex: none;
      }
      /* listas */
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 12px;
        background: #fff;
        border: 1px solid var(--bd);
        border-left: 4px solid var(--bd);
        border-radius: var(--rad);
        margin-bottom: 8px;
        cursor: pointer;
      }
      .item:hover {
        border-color: #aeb7c2;
      }
      .item.s-zero {
        border-left-color: var(--r);
      }
      .item.s-low {
        border-left-color: #e0a800;
      }
      .item.s-ok {
        border-left-color: var(--ok);
      }
      .item .im {
        width: 42px;
        height: 42px;
        border-radius: 6px;
        background: var(--gl);
        color: var(--g);
        display: grid;
        place-items: center;
        font-size: 22px;
        overflow: hidden;
        flex: none;
      }
      .item .im .i {
        width: 1em;
        height: 1em;
        vertical-align: 0;
      }
      .item .im img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .item .t {
        flex: 1;
        min-width: 0;
      }
      .item .t b {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
      }
      .item .t small {
        color: var(--mu);
        font-size: 14px;
      }
      .badge {
        display: inline-block;
        border-radius: 20px;
        padding: 2px 10px;
        font-size: 13px;
        font-weight: 700;
        background: var(--okl);
        color: #0b5a40;
      }
      .badge.r {
        background: var(--rl);
        color: #8f1d14;
      }
      .badge.a {
        background: var(--al);
        color: #6b4500;
      }
      .badge.n {
        background: #e6eaee;
        color: var(--mu);
      }
      .qty {
        text-align: right;
        font-family: var(--cond);
        font-weight: 700;
        font-size: 24px;
        line-height: 1.05;
        white-space: nowrap;
      }
      .qty small {
        display: block;
        font-family: var(--sans);
        font-weight: 500;
        color: var(--mu);
        font-size: 13px;
      }
      .alert {
        border-radius: var(--rad);
        padding: 10px 12px;
        margin-bottom: 8px;
        font-size: 15px;
        display: flex;
        gap: 9px;
        align-items: flex-start;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .alert.r {
        background: var(--rl);
        color: #7a1810;
        border-color: #f0bdb7;
      }
      .alert.a {
        background: var(--al);
        color: #5c3b00;
        border-color: #efd58a;
      }
      .alert.i {
        background: #e3ecf8;
        color: #12356b;
        border-color: #bfd0ea;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding-bottom: 6px;
        margin: 10px 0;
      }
      .chip {
        border: 1.5px solid #aeb7c2;
        background: #fff;
        border-radius: 20px;
        padding: 7px 14px;
        white-space: nowrap;
        font-size: 15px;
        cursor: pointer;
        font-weight: 600;
      }
      .chip.on {
        background: var(--g);
        color: #fff;
        border-color: var(--g);
      }
      .empty {
        text-align: center;
        color: var(--mu);
        padding: 34px 10px;
      }
      .empty big {
        font-size: 40px;
        display: block;
        color: #aeb7c2;
      }
      .empty big .i {
        width: 1em;
        height: 1em;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 7px;
        border-bottom: 1px solid var(--bd);
      }
      th {
        color: var(--mu);
        font-size: 14px;
        font-weight: 600;
      }
      .tw {
        overflow: auto;
      }
      /* janelas e avisos */
      #modal {
        position: fixed;
        inset: 0;
        background: rgba(15, 25, 45, 0.55);
        z-index: 50;
        display: none;
        align-items: flex-end;
        justify-content: center;
      }
      #modal.open {
        display: flex;
      }
      #modal .sheet {
        background: #fff;
        width: 100%;
        max-width: 560px;
        max-height: 92vh;
        overflow: auto;
        border-radius: 14px 14px 0 0;
        padding: 20px;
      }
      @media (min-width: 700px) {
        #modal {
          align-items: center;
        }
        #modal .sheet {
          border-radius: 10px;
        }
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 92px;
        transform: translateX(-50%);
        background: var(--tx);
        color: #fff;
        padding: 12px 18px;
        border-radius: 6px;
        z-index: 99;
        display: none;
        max-width: 90%;
        font-size: 16px;
        font-weight: 500;
      }
      #toast.err {
        background: var(--r);
      }
      .banner {
        background: var(--yl);
        color: #3b3000;
        border-left: 4px solid var(--y);
        border-radius: var(--rad);
        padding: 10px 12px;
        font-size: 15px;
        margin-bottom: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .banner span {
        flex: 1;
        min-width: 200px;
      }
      .ob {
        max-width: 480px;
        margin: 0 auto;
        padding: 28px 18px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .ob .logo {
        font-size: 40px;
        justify-content: center;
      }
      .ob p.sub {
        text-align: center;
        color: var(--mu);
        margin: 6px 0 24px;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        border: 1.5px solid #aeb7c2;
        background: #fff;
        border-radius: 6px;
        padding: 14px;
        margin-bottom: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 17px;
      }
      .opt:hover {
        border-color: var(--g);
        background: var(--gl);
      }
      .segment-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        max-height: 56vh;
        overflow: auto;
        padding: 2px;
      }
      .opt.segment-choice {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
        min-height: 60px;
        padding: 9px 10px;
        margin: 0;
        font-size: 15px;
      }
      .segment-emoji {
        font-size: 22px;
      }
      .segment-choice small {
        display: block;
        margin-top: 2px;
        color: var(--mu);
        font-size: 12px;
        font-weight: 500;
      }
      .segment-search-results {
        display: grid;
        gap: 6px;
        max-height: 42vh;
        overflow: auto;
        margin: 8px 0 12px;
      }
      .segment-search-results .opt {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 10px 12px;
        font-size: 15px;
      }
      .segment-search-results .segment-emoji {
        flex: none;
      }
      .segment-search-results .segment-mode {
        margin-left: auto;
        color: var(--mu);
        font-size: 13px;
        font-weight: 500;
      }
      .segment-custom-option {
        width: 100%;
        text-align: left;
        border: 1px dashed var(--g);
        border-radius: 6px;
        padding: 10px 12px;
        background: var(--gl);
        color: var(--g);
        font-weight: 600;
        cursor: pointer;
      }
      .segment-custom-option.hide {
        display: none;
      }
      @media (max-width: 560px) {
        .segment-list {
          grid-template-columns: 1fr;
        }
      }
      .prog {
        height: 5px;
        background: var(--bd);
        border-radius: 5px;
        margin-bottom: 22px;
      }
      .prog div {
        height: 100%;
        background: var(--g);
        border-radius: 5px;
      }
      /* PDV */
      .pdv {
        display: grid;
        gap: 12px;
      }
      @media (min-width: 900px) {
        .pdv {
          grid-template-columns: 1.2fr 1fr;
        }
      }
      .plist {
        max-height: 46vh;
        overflow: auto;
      }
      .tot {
        position: relative;
        font-family: var(--cond);
        font-weight: 800;
        font-size: 46px;
        line-height: 1;
        text-align: right;
        background: var(--y);
        color: var(--tx);
        padding: 12px 16px 12px 40px;
        border-radius: 4px;
        margin: 10px 0;
      }
      .tot::before {
        content: "";
        position: absolute;
        left: 14px;
        top: 50%;
        width: 12px;
        height: 12px;
        margin-top: -6px;
        border-radius: 50%;
        background: var(--card);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      .cartline {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--bd);
      }
      .cartline .t {
        flex: 1;
        min-width: 0;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .step button {
        width: 38px;
        height: 38px;
        border-radius: 4px;
        border: 1.5px solid #aeb7c2;
        background: #fff;
        font-weight: 700;
        font-size: 20px;
        cursor: pointer;
      }
      .step input {
        width: 58px;
        min-height: 38px;
        padding: 4px;
        text-align: center;
      }
      .pay {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .muted {
        color: var(--mu);
        font-size: 14px;
      }
      .hide {
        display: none;
      }
      .meter {
        height: 8px;
        background: var(--bd);
        border-radius: 8px;
        overflow: hidden;
        margin: 4px 0 12px;
      }
      .meter div {
        height: 100%;
        background: var(--g);
      }
      .meter.warn div {
        background: #e0a800;
      }
      .meter.full div {
        background: var(--r);
      }
      details {
        border-bottom: 1px solid var(--bd);
        padding: 14px 2px;
      }
      summary {
        font-weight: 600;
        cursor: pointer;
        font-size: 18px;
      }
      details p {
        color: var(--mu);
        margin: 8px 0 0;
        max-width: 62ch;
      }
      .tog {
        display: inline-flex;
        background: #fff;
        border: 1.5px solid #aeb7c2;
        border-radius: 6px;
        padding: 3px;
        gap: 2px;
      }
      .tog button {
        border: 0;
        background: none;
        padding: 7px 16px;
        border-radius: 4px;
        font-weight: 700;
        cursor: pointer;
        color: var(--mu);
        font-size: 15px;
      }
      .tog button.on {
        background: var(--g);
        color: #fff;
      }
      .proto {
        background: var(--tx);
        color: #d3d9de;
        font-size: 13px;
        text-align: center;
        padding: 7px 12px;
      }
      .authbox {
        max-width: 420px;
        margin: 0 auto;
        padding: 30px 18px 56px;
      }
      .authbox h1 {
        font-size: 34px;
      }
      /* site público */
      .pub {
        background: var(--bg);
        min-height: 100vh;
      }
      .pubnav {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 14px 20px;
        max-width: 1160px;
        margin: 0 auto;
      }
      .pubnav .sp {
        flex: 1;
      }
      .pubnav a.l {
        color: var(--tx);
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
      }
      .pubnav a.l:hover {
        color: var(--g);
      }
      @media (max-width: 640px) {
        .pubnav a.l.opt-hide {
          display: none;
        }
        .pubnav {
          gap: 14px;
        }
      }
      .lp {
        max-width: 1160px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .hero {
        display: grid;
        gap: 40px;
        padding: 34px 0 64px;
        align-items: center;
      }
      @media (min-width: 900px) {
        .hero {
          grid-template-columns: 1.1fr 0.9fr;
          padding: 56px 0 84px;
        }
      }
      .hero h1 {
        font-size: clamp(46px, 8vw, 92px);
        line-height: 0.92;
        margin: 0 0 20px;
        letter-spacing: -0.015em;
        font-weight: 800;
      }
      .hero-girou {
        display: inline-block;
        max-width: 0;
        overflow: hidden;
        vertical-align: bottom;
        white-space: nowrap;
        color: var(--g);
        border-right: 3px solid var(--y);
        padding-right: 2px;
        text-decoration: underline;
        text-decoration-color: var(--y);
        text-decoration-thickness: 0.09em;
        text-underline-offset: 0.08em;
        animation:
          girouType 1.1s steps(6, end) 0.45s forwards,
          girouCursor 0.7s steps(1, end) 3,
          girouCursorOff 0.01s 2.55s forwards;
      }
      .hero-letter-o {
        display: inline-block;
        width: 0.7em;
        height: 0.7em;
        margin: 0 0.02em;
        vertical-align: -0.07em;
        overflow: visible;
      }
      .hero-letter-o .mark-disc {
        fill: var(--y);
      }
      .hero-letter-o .mark-check {
        fill: none;
        stroke: var(--g);
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      @keyframes girouType {
        to {
          max-width: 6ch;
        }
      }
      @keyframes girouCursor {
        50% {
          border-right-color: transparent;
        }
      }
      @keyframes girouCursorOff {
        to {
          border-right-color: transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hero-girou {
          max-width: none;
          border: 0;
          padding: 0;
          animation: none;
        }
      }
      .hero p.lead {
        font-size: 20px;
        max-width: 34em;
        margin: 0 0 26px;
        color: #2b3547;
      }
      .hero .cta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .hero .fine {
        display: block;
        margin-top: 14px;
        color: var(--mu);
        font-size: 15px;
        max-width: 34em;
      }
      /* cupom */
      .cupom {
        position: relative;
        background: #fdfdfb;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.5;
        padding: 22px 20px 34px;
        max-width: 400px;
        width: 100%;
        justify-self: center;
        transform: rotate(1.6deg);
        box-shadow:
          0 1px 0 rgba(0, 0, 0, 0.08),
          0 18px 28px -18px rgba(15, 25, 45, 0.5);
        -webkit-mask: conic-gradient(
            from -45deg at bottom,
            #0000,
            #000 1deg 89deg,
            #0000 90deg
          )
          50%/14px 100%;
        mask: conic-gradient(
            from -45deg at bottom,
            #0000,
            #000 1deg 89deg,
            #0000 90deg
          )
          50%/14px 100%;
      }
      .cupom .c {
        text-align: center;
      }
      .cupom .l {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .cupom hr {
        border: 0;
        border-top: 1px dashed #8a93a0;
        margin: 9px 0;
      }
      .cupom .big {
        font-size: 19px;
        font-weight: 700;
      }
      .cupom .low {
        background: var(--y);
        padding: 0 5px;
        font-weight: 700;
      }
      .cupom .stamp {
        display: inline-block;
        border: 2px solid var(--ok);
        color: var(--ok);
        padding: 1px 8px;
        font-weight: 700;
        transform: rotate(-3deg);
        margin-top: 4px;
      }
      .cupom .ln {
        opacity: 0;
        animation: print 0.3s ease-out forwards;
        animation-delay: calc(var(--i) * 0.28s + 0.3s);
      }
      @keyframes print {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cupom .ln {
          animation: none;
          opacity: 1;
        }
        html {
          scroll-behavior: auto;
        }
      }
      .sect {
        padding: 56px 0;
        border-top: 1px solid var(--bd);
      }
      .sect h2 {
        font-size: clamp(32px, 5vw, 46px);
        margin: 0 0 8px;
        line-height: 1;
      }
      .sect .sub {
        color: var(--mu);
        margin: 0 0 28px;
        max-width: 44em;
        font-size: 18px;
      }
      .rows {
        display: block;
      }
      .rows .rw {
        display: grid;
        gap: 4px 40px;
        padding: 18px 0;
        border-bottom: 1px solid var(--bd);
      }
      @media (min-width: 760px) {
        .rows .rw {
          grid-template-columns: 300px 1fr;
        }
      }
      .rows .rw b {
        font-family: var(--cond);
        font-size: 26px;
        line-height: 1.1;
        font-weight: 700;
      }
      .rows .rw span {

            .map((x) => x.toString(16).padStart(2, "0"))

          const s = salt + "|" + pw;

          y = b.expiry || "9999";

      };

      /* ---------- saldo e lote por local ---------- */
      const EPS = 1e-9;
      const mainLoc = (p) =>
        p.location || (db.locs && db.locs[0]) || "Principal";
      const stockAt = (p, l) => r3((p.stock || {})[l] || 0);
      const batchesAt = (p, l) => (p.batches || []).filter((b) => b.loc === l);
      const pharmaOn = () =>
        !!(db.settings.farma && db.settings.farma.on) && hasFeat("farma");
      const bExpired = (b) => {
        const d = bDays(b);

      };
      const sellable = (b) => !b.hold && !(pharmaOn() && bExpired(b));
      const strictSaleLoc = () =>
        db.locs.length > 1 &&
        db.settings.saleLoc &&
        db.locs.includes(db.settings.saleLoc)
          ? db.settings.saleLoc
          : "";
      /* quanto pode sair em venda (sem lote bloqueado e, na farmácia, sem lote vencido) */
      function availAt(p, l) {
        const blocked = batchesAt(p, l)
          .filter((b) => !sellable(b))
          .reduce((a, b) => a + b.qty, 0);
        return r3(Math.max(0, stockAt(p, l) - blocked));
      }
      function saleAvail(p) {
        const sl = strictSaleLoc();
        return sl
          ? availAt(p, sl)
          : r3(
              Object.keys(p.stock || {}).reduce((a, l) => a + availAt(p, l), 0),
            );
      }
      function locsText(p) {
        const e = Object.entries(p.stock || {}).filter(
          ([, v]) => Math.abs(v) > EPS,

        return e.length > 1
          ? e.map(([l, v]) => l + " " + num(v)).join(", ")
          : e[0]
            ? e[0][0]

      }
      function migStock(d) {
        (d.products || []).forEach((p) => {
          const L = p.location || (d.locs && d.locs[0]) || "Principal";
          if (!p.stock) {
            p.stock = {};
            if (p.qty > 0) p.stock[L] = p.qty;
          }
          (p.batches || []).forEach((b) => {
            if (!b.loc) b.loc = L;
          });
        });
        d.stockV = 1;

      function _addBatch(p, lot, expiry, loc, q, hold) {
        const b = p.batches.find(
          (x) =>
            x.lot === lot &&
            (x.expiry || "") === (expiry || "") &&
            x.loc === loc,
        );
        if (b) {
          b.qty = r3(b.qty + q);
          if (hold && !b.hold) b.hold = hold;
        } else
          p.batches.push({
            lot,
            expiry: expiry || "",
            qty: q,
            loc,
            ...(hold ? { hold } : {}),
          });
      }
      function _addStock(p, l, q) {
        p.stock = p.stock || {};
        p.stock[l] = r3((p.stock[l] || 0) + q);
      }
      function _apply(o) {
        const p = db.products.find((x) => x.id === o.pid);
        if (!p) throw Error("Produto não encontrado.");
        if (
          o.type === "saida" &&
          !o.rx &&
          pharmaOn() &&
          ["tarja", "antimicrobiano", "controlado"].includes(
            (p.farma || {}).cls,
          )
        )
          throw Error(RXMSG);
        if (
          IN.includes(o.type) &&
          o.type === "entrada" &&
          pharmaOn() &&
          ["livre", "tarja", "antimicrobiano", "controlado"].includes(
            (p.farma || {}).cls,
          ) &&
          !o.restore
        ) {
          if (!(o.lot || "").trim() || !o.expiry)
            throw Error("Medicamento: informe o lote e a validade na entrada.");
          if (o.expiry < new Date().toISOString().slice(0, 10))
            throw Error(
              "Não é possível dar entrada em medicamento com a validade vencida.",
            );
        }
        const q = +o.qty;
        if (isNaN(q) || q < 0 || (o.type !== "ajuste" && q <= 0))
          throw Error("Informe uma quantidade maior que zero.");
        if (!db.locs.length) db.locs = ["Principal"];
        p.batches = p.batches || [];
        p.stock = p.stock || {};
        const before = p.qty,
          main = mainLoc(p),
          lots = [];
        let delta,
          loc = o.loc || main,
          toLoc = "",
          note = o.note || "";
        if (o.loc && !db.locs.includes(o.loc))
          throw Error('Local "' + o.loc + '" não cadastrado.');
        if (o.type === "ajuste") {
          const cur = o.total ? before : stockAt(p, loc);
          delta = q - cur;
        } else if (IN.includes(o.type)) delta = q;
        else if (o.type === "transferencia") delta = 0;
        else delta = -q;
        if (o.type === "transferencia") {
          const from = o.from || main;
          toLoc = o.to;
          loc = from;
          if (!toLoc || toLoc === from)
            throw Error("Escolha um local de destino diferente da origem.");
          if (!db.locs.includes(toLoc) || !db.locs.includes(from))
            throw Error("Local não cadastrado.");
          if (q > stockAt(p, from) + EPS)
            throw Error(
              "Só há " +
                num(stockAt(p, from)) +
                " " +
                p.unit +
                ' de "' +
                p.name +
                '" em ' +
                from +
                ".",
            );
          let need = q;
          const cand = batchesAt(p, from)
            .filter((b) => !o.lot || b.lot === o.lot)
            .sort(fefo);
          if (o.lot && !cand.length)
            throw Error("Lote não encontrado neste local.");
          for (const b of cand) {
            if (need <= EPS) break;
            const t = Math.min(b.qty, need);
            if (t <= 0) continue;
            b.qty = r3(b.qty - t);
            _addBatch(p, b.lot, b.expiry, toLoc, t, b.hold);
            need = r3(need - t);
            lots.push({
              lot: b.lot || "(sem nº)",
              qty: t,
              loc: from,
              to: toLoc,
              b: 1,
              expiry: b.expiry || "",
            });
          }
          if (need > EPS && o.lot)
            throw Error(
              "O lote " +
                o.lot +
                " só tem " +
                num(q - need) +
                " " +
                p.unit +
                " em " +
                from +
                ".",
            );
          _addStock(p, from, -q);
          _addStock(p, toLoc, q);
          if (stockAt(p, main) <= EPS) p.location = toLoc;
          note = ("De " + from + " para " + toLoc + ". " + note).trim();
        } else if (delta > EPS) {
          const lot = (o.lot || "").trim(),
            exp = o.expiry || "";
          if (Array.isArray(o.restore) && o.restore.length) {
            // estorno: volta aos mesmos lotes e locais da venda
            let left = delta;
            o.restore.forEach((e) => {
              const t = Math.min(e.qty, left);
              if (t <= 0 || !e.b) return;
              const l = e.loc && db.locs.includes(e.loc) ? e.loc : main;
              _addBatch(p, e.lot === "(sem nº)" ? "" : e.lot, e.expiry, l, t);
              _addStock(p, l, t);
              lots.push({
                lot: e.lot,
                qty: t,
                loc: l,
                b: 1,
                expiry: e.expiry || "",
              });
              left = r3(left - t);
            });
            if (left > EPS) _addStock(p, main, left);
          } else {
            _addStock(p, loc, delta);
            if (lotsOn() && (lot || exp)) {
              _addBatch(p, lot, exp, loc, delta);
              lots.push({
                lot: lot || "(sem nº)",
                qty: delta,
                loc,
                b: 1,
                expiry: exp,
              });
            }
          }
        } else if (delta < -EPS) {
          const need0 = -delta,
            kind = o.type === "saida" ? "saida" : "outro";
          const strict =
            o.type === "ajuste" && !o.total
              ? loc
              : o.loc || (kind === "saida" ? strictSaleLoc() : "");
          const scope = strict
            ? [strict]
            : [main, ...Object.keys(p.stock).filter((l) => l !== main)];
          let el = p.batches.filter(
            (b) =>
              scope.includes(b.loc) &&
              (!o.lot || b.lot === o.lot) &&
              (kind !== "saida" || sellable(b)),
          );
          if (o.lot) {
            const have = r3(el.reduce((a, b) => a + b.qty, 0));
            if (!have) {
              const any = p.batches.find((b) => b.lot === o.lot);
              throw Error(
                any
                  ? any.hold
                    ? "O lote " +
                      o.lot +
                      " está bloqueado (" +
                      any.hold.reason +
                      ")."
                    : "O lote " + o.lot + " não pode ser usado nesta saída."
                  : "Lote não encontrado.",
              );
            }
            if (have < need0 - EPS)
              throw Error(
                "O lote " +
                  o.lot +
                  " só tem " +
                  num(have) +
                  " " +
                  p.unit +
                  (strict ? " em " + strict : "") +
                  ". Diminua a quantidade ou escolha outro lote.",
              );
          } else {
            const total = r3(
              scope.reduce(
                (a, l) =>
                  a + (kind === "saida" ? availAt(p, l) : stockAt(p, l)),
                0,
              ),
            );
            if (total < need0 - EPS && !(o.force && can("overdraw"))) {
              const all = r3(scope.reduce((a, l) => a + stockAt(p, l), 0)),
                other = r3(p.qty - all);
              if (strict && o.type !== "ajuste")
                throw Error(
                  "Só há " +
                    num(total) +
                    " " +
                    p.unit +
                    ' de "' +
                    p.name +
                    '" em ' +
                    strict +
                    (other > EPS
                      ? " (" +
                        num(other) +
                        " em outros locais; faça uma transferência)"
                      : "") +
                    ". Diminua a quantidade.",
                );
              if (all - total > EPS && all >= need0 - EPS)
                throw Error(
                  '"' +
                    p.name +
                    '" tem ' +
                    num(all) +
                    " " +
                    p.unit +
                    ", mas " +
                    num(all - total) +
                    " estão bloqueados ou vencidos e não podem ser vendidos.",
                );

                'Saldo insuficiente: "' +
                  p.name +
                  '" tem ' +
                  num(before) +
                  " " +
                  p.unit +
                  " em estoque. Diminua a quantidade.",
              );
            }
          }
          let need = need0;
          for (const b of el.sort(fefo)) {
            if (need <= EPS) break;
            const t = Math.min(b.qty, need);
            if (t > 0) {
              b.qty = r3(b.qty - t);
              _addStock(p, b.loc, -t);
              need = r3(need - t);
              lots.push({
                lot: b.lot || "(sem nº)",
                qty: t,
                loc: b.loc,
                b: 1,
                expiry: b.expiry || "",
              });
            }
          }
          if (need > EPS && !o.lot)
            for (const l of scope) {
              if (need <= EPS) break;
              const unl = r3(
                stockAt(p, l) - batchesAt(p, l).reduce((a, b) => a + b.qty, 0),
              );
              const t = Math.min(Math.max(unl, 0), need);
              if (t > 0) {
                _addStock(p, l, -t);
                need = r3(need - t);
              }
            }
          if (need > EPS) {
            // só chega aqui com saldo negativo autorizado pelo administrador
            if (!(o.force && can("overdraw")))
              throw Error(
                'Saldo insuficiente: "' +
                  p.name +
                  '" tem ' +
                  num(before) +
                  " " +
                  p.unit +
                  " em estoque. Diminua a quantidade.",
              );
            _addStock(p, scope[0], -need);
          }
        }
        p.batches = p.batches.filter((b) => b.qty > EPS);
        Object.keys(p.stock).forEach((l) => {
          if (Math.abs(p.stock[l]) < EPS) delete p.stock[l];
        });
        p.qty = r3(before + delta);
        const m = {
          id: uid(),
          ts: Date.now(),
          pid: p.id,
          type: o.type,
          delta: r3(delta),
          before,
          after: p.qty,
          reason: o.reason || TYPES[o.type].s,
          note,
          user: curUser().name,
          ref: o.ref || "",
          lots,
          loc: loc || "",
          ...(toLoc ? { to: toLoc } : {}),
        };
        db.movements.push(m);
        return m;
      }
      const move = (o) => tx(() => _apply(o));
      const stState = (p) =>
        p.qty <= 0 ? "zero" : p.qty <= p.min ? "low" : "ok";
      const bDays = (b) =>
        b.expiry
          ? Math.ceil((new Date(b.expiry + "T23:59:59") - Date.now()) / DAY)
          : null;
      function lastMove(pid) {
        let t = 0;

        return t;
      }
      function consumo(pid, dias) {
        const lim = Date.now() - dias * DAY;

            (m) =>

      function nearBatches() {

          .forEach((p) =>
            (p.batches || []).forEach((b) => {
              const d = bDays(b);
              if (d !== null && d <= ex) out.push({ p, b, d });

          );
        return out.sort((a, b) => a.d - b.d);

      function alerts() {

          A.push(
            d < 0

                  l: "r",

                    nm +

                    " " +

            A.push({

      function lotHold(pid, idx) {
        if (rwBlock()) return;

          b0 = p0 && p0.batches[idx];

        let why = "";
        if (b0.hold) {
          if (
            !confirm(
              "Liberar o lote " + (b0.lot || "(sem nº)") + " para venda?",
            )
          )
            return;
        } else {
          why = (
            prompt(

          if (why.length < 5) {

            return;

        try {
          tx(() => {
            const p = db.products.find((x) => x.id === pid),
              b = p.batches[idx];

              aud("Lote liberado", p.name + " lote " + (b.lot || "(sem nº)"));

              same.forEach(
                (x) =>

          toast(e.message, 1);

        render();
        toast(b0.hold ? "Lote liberado." : "Lote bloqueado.");

      function photoPick(inp) {

            const c = document.createElement("canvas"),
              k = Math.min(1, 160 / Math.max(im.width, im.height));
            c.width = im.width * k;
            c.height = im.height * k;
            c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);

          im.src = r.result;

        r.readAsDataURL(f);

      function dlTemplate() {

          "text/csv",

      function parseCSV(t) {
        const first = t.split(/\r?\n/)[0],
          sep = first.includes(";") ? ";" : ",";
        const rows = [];
        let r = [],
          c = "",
          q = false;
        for (let i = 0; i < t.length; i++) {
          const ch = t[i];
          if (q) {
            if (ch == '"' && t[i + 1] == '"') {
              c += '"';
              i++;
            } else if (ch == '"') q = false;
            else c += ch;
          } else if (ch == '"') q = true;
          else if (ch == sep) {
            r.push(c);
            c = "";
          } else if (ch == "\n") {
            r.push(c);
            rows.push(r);
            r = [];
            c = "";
          } else if (ch != "\r") c += ch;
        }
        if (c || r.length) {
          r.push(c);
          rows.push(r);
        }
        return rows.filter((x) => x.some((y) => y.trim()));
      }
      function importFile(inp) {
        const f = inp.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          const rows = parseCSV(String(rd.result).replace(/^﻿/, ""));
          if (rows.length < 2) {
            toast("Arquivo vazio ou sem linhas de produtos.", 1);
            return;
          }
          const H = rows[0].map((h) => norm(h).trim()),
            col = (n) => H.findIndex((h) => h.startsWith(n));
          const ix = {
            name: col("nome"),
            code: col("cod"),
            bar: col("barr"),
            cat: col("categ"),
            un: col("unid"),
            qty: col("quant"),
            min: col("min"),
            cost: col("cust"),
            price: col("prec"),
          };
          if (ix.name < 0) {
            toast('Não encontrei a coluna "nome" na primeira linha.', 1);
            return;
          }
          const n = (v) => {
              const s = String(v || "").trim(),
                x = parseFloat(
                  s.includes(",") ? s.replace(/\./g, "").replace(",", ".") : s,
                );
              return isNaN(x) ? 0 : x;
            },
            get = (r, i) => (i >= 0 ? (r[i] || "").trim() : "");
          let add = 0,
            skip = 0,
            cut = 0;
          try {
            tx(() => {
              rows.slice(1).forEach((r) => {
                const name = get(r, ix.name);
                if (!name) {
                  skip++;
                  return;
                }
                const code = get(r, ix.code),
                  bar = get(r, ix.bar);
                if (
                  db.products.some(
                    (x) =>
                      (bar && x.barcode === bar) ||
                      (code && x.code === code) ||
                      norm(x.name) === norm(name),
                  )
                ) {
                  skip++;
                  return;
                }
                if (db.products.length >= lim("products")) {
                  cut++;
                  return;
                }
                const cat = get(r, ix.cat);
                if (cat && !db.cats.includes(cat)) db.cats.push(cat);
                const p = {
                  id: uid(),
                  name,
                  code,
                  barcode: bar,
                  category: cat,
                  brand: "",
                  unit: get(r, ix.un) || "un",
                  qty: 0,
                  min: n(get(r, ix.min)),
                  cost: n(get(r, ix.cost)),
                  price: get(r, ix.price) ? n(get(r, ix.price)) : "",
                  location: db.locs[0],
                  notes: "",
                  photo: "",
                  active: true,
                  batches: [],
                };
                db.products.push(p);
                add++;
                const q = n(get(r, ix.qty));
                if (q > 0)
                  _apply({
                    pid: p.id,
                    type: "entrada",
                    qty: q,
                    reason: "Importação de planilha",
                  });
              });
              aud("Importação de planilha", add + " produto(s)");
            });
          } catch (e) {
            toast(e.message, 1);
            return;
          }
          closeModal();
          render();
          toast(
            add +
              " produto(s) importado(s)" +
              (skip ? ", " + skip + " ignorado(s)" : "") +
              (cut ? ", " + cut + " fora do limite do plano" : "") +
              ".",
            cut > 0,
          );
        };
        rd.readAsText(f, "UTF-8");
      }

          ),
          orderPayments = (db.orders || []).flatMap((order) =>
            (order.payments || [])
              .filter((payment) => payment.cashId === c.id)
              .map((payment) => ({ ...payment, orderId: order.id })),
          ),
          sum = (m) =>
            S.filter((s) => s.pay === m).reduce((a, s) => a + s.total, 0) +
            orderPayments
              .filter((payment) => payment.pay === m)
              .reduce((a, payment) => a + payment.amount, 0),
          ordersCounted = new Set(
            orderPayments.map((payment) => payment.orderId),
          );
        return {
          n: S.length + ordersCounted.size,
          total:
            S.reduce((a, s) => a + s.total, 0) +
            orderPayments.reduce((a, payment) => a + payment.amount, 0),
          din: sum("Dinheiro"),
          pix: sum("Pix"),
          deb: sum("Cartão débito"),
          cre: sum("Cartão crédito"),
          rcv: rcvCash(c),
          expected: c.initial + sum("Dinheiro") + rcvCash(c),

      VIEWS.pdv = () => {

          total = r2(sub - disc);

       <p class="muted" style="margin-top:0">Cada venda baixa o estoque na hora, em todas as janelas abertas. Venda sem estoque suficiente é bloqueada. Atalhos: F2 busca · F9 finaliza.</p>
             ${mode.field ? `<label for="pdvref">${mode.field} *</label><input id="pdvref" value="${esc(pdvRef)}" placeholder="${mode.placeholder}" aria-required="true" oninput="pdvRef=this.value">` : ""}
       <div class="pdv"><div>
        <div class="row"><input id="pdvq" type="search" placeholder="Bipe o código de barras ou busque o produto" value="${esc(pdvQ)}" oninput="pdvQ=this.value;render()" onkeydown="if(event.key==='Enter')pdvEnter(this.value)"><button class="btn ghost fit" onclick="scan(c=>pdvEnter(c))">📷</button></div>

       </div><div>
        <div class="card"><h2 style="margin-top:0">Venda atual</h2>
        ${items.length ? items.map(({ c, p }) => `<div class="cartline"><div class="t"><b>${esc(p.name)}</b><small class="muted">${brl(p.price || 0)} × ${num(c.qty)} = ${brl(c.qty * (p.price || 0))}</small></div><div class="step"><button onclick="pdvQty('${p.id}',-1)">−</button><input type="number" step="any" min="0" value="${c.qty}" onchange="pdvSet('${p.id}',this.value)"><button onclick="pdvQty('${p.id}',1)">+</button></div></div>`).join("") : '<p class="muted">Carrinho vazio. Toque em um produto ou bipe o código.</p>'}
        <label>Desconto (R$)</label><input type="number" id="pdvd" step="any" min="0" value="${esc(pdvDisc)}" oninput="pdvDisc=this.value;render()">
        ${cliPdvBlock()}
        <label>Forma de pagamento (apenas registro)</label><div class="pay">${["Dinheiro", "Pix", "Cartão débito", "Cartão crédito", ...(cliOn() && custById(pdvCust) ? ["Fiado"] : [])].map((m) => `<button class="chip ${pdvPay === m ? "on" : ""}" onclick="pdvPay='${m}';render()">${m}</button>`).join("")}</div>
        ${cliPdvFiado(total)}
        ${pdvPay === "Dinheiro" ? `<label>Valor recebido (R$)</label><input type="number" id="pdvr" step="any" min="0" value="${esc(pdvRec)}" oninput="pdvRec=this.value;render()">${rec ? `<p>Troco: <b>${rec >= total ? brl(troco) : '<span style="color:var(--r)">valor insuficiente</span>'}</b></p>` : ""}` : ""}
        ${fiscalOn() ? (fiscalReady() ? `<label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--tx);margin-top:10px"><input type="checkbox" style="width:20px;min-height:20px" ${nfceWanted() ? "checked" : ""} onchange="pdvNfce=this.checked;render()"> Emitir NFC-e <span class="muted">(${envLabel()})</span></label>${nfceWanted() ? `<label>CPF na nota (opcional)</label><input id="pdvcpf" inputmode="numeric" value="${esc(pdvCpf)}" oninput="pdvCpf=this.value">` : ""}` : `<p class="muted">NFC-e: complete a configuração fiscal em Mais → Notas fiscais.</p>`) : ""}
        <div class="tot">${brl(total)}</div><br>
        ${cx ? `<button class="btn full" onclick="pdvFinish()" ${items.length ? "" : 'disabled style="opacity:.5"'}>✅ Finalizar venda</button>` : `<button class="btn amb full" onclick="openCaixaModal()">🔓 Abrir caixa para vender</button>`}<br><br><button class="btn ghost full" onclick="cart=[];pdvRef='';pdvDisc='';pdvRec='';pdvRx=null;render()">Limpar carrinho</button></div>
        <div class="card"><b>${cx ? "Caixa aberto" : "Caixa fechado"}</b>${cx ? `<div class="muted">Desde ${dt(cx.openedAt)} · troco inicial ${brl(cx.initial)}<br>${cs.n} venda(s) · <b style="color:var(--tx)">${brl(cs.total)}</b><br>Dinheiro ${brl(cs.din)} · Pix ${brl(cs.pix)} · Débito ${brl(cs.deb)} · Crédito ${brl(cs.cre)}</div><br><button class="btn ghost sm" onclick="closeCaixaModal()">Fechar caixa</button>` : `<div class="muted">${ok.length} venda(s) hoje · ${brl(sum())}<br><b>Abra o caixa para registrar vendas.</b></div><br><button class="btn ghost sm" onclick="openCaixaModal()">Abrir caixa</button>`}</div>
       </div></div>

         today.length

                   `<div class="item" onclick="saleDetail('${s.id}')"><div class="im">🧾</div><div class="t"><b>Venda #${s.n} · ${brl(s.total)}</b><small>${dt(s.ts)} · ${esc(s.pay)} · ${esc(s.user)}</small></div>${s.status === "ok" ? '<span class="badge">Paga</span>' : '<span class="badge r">Estornada</span>'}</div>`,
               )
               .join("")

       }`;
      };
      function pdvEnter(v) {
        const e = exact(v);
        if (e) {
          pdvAdd(e.id);
          pdvQ = "";
          render();

          const L = findProducts(v, true);
          if (L.length === 1) {
            pdvAdd(L[0].id);
            pdvQ = "";
            render();
          } else
            toast(
              L.length

                : "Produto não encontrado.",

            );
        }
      }
      function pdvAdd(id) {
        const p = db.products.find((x) => x.id === id);
        if (!p) return;
        if (saleAvail(p) <= 0) {
          toast(
            '"' +
              p.name +
              '" ' +
              (p.qty > 0
                ? "não tem saldo disponível para venda (bloqueado, vencido ou em outro local)."

            1,
          );
          return;
        }
        if (!p.price) {
          toast(
            'Cadastre o preço de venda de "' + p.name + '" antes de vender.',
            1,

          return;
        }
        const c = cart.find((x) => x.pid === id);
        if (c) {
          if (c.qty + 1 > saleAvail(p)) {
            toast(
              "Só há " + num(saleAvail(p)) + " " + p.unit + " disponível.",
              1,
            );
            return;
          }
          c.qty++;

        render();
      }
      function pdvQty(id, d) {
        const c = cart.find((x) => x.pid === id);
        if (!c) return;
        pdvSet(id, c.qty + d);
      }
      function pdvSet(id, v) {
        v = +v;
        const p = db.products.find((x) => x.id === id);
        if (v <= 0) {
          cart = cart.filter((x) => x.pid !== id);
        } else {
          if (v > saleAvail(p)) {
            toast(
              "Só há " + num(saleAvail(p)) + " " + p.unit + " disponível.",
              1,
            );
            v = saleAvail(p);

          cart.find((x) => x.pid === id).qty = v;

        render();
      }
      let pdvNfce = null,
        pdvCpf = "";
      const nfceWanted = () =>
        fiscalOn() &&
        fiscalReady() &&
        (pdvNfce === null ? db.fiscal.settings.autoNfce : pdvNfce);
      function pdvFinish() {
        if (rwBlock()) return;
        if (!can("pdv")) {
          toast("Seu perfil não permite vender.", 1);
          return;
        }
        if (!cart.length) return;
        if (!caixaAberto()) {
          toast("Abra o caixa para registrar vendas.", 1);
          openCaixaModal();
          return;
        }
        const modeKey = currentPdvMode(),
          mode = PDV_MODES[modeKey];
        if (mode.required && !pdvRef.trim()) {
          toast(`Informe ${mode.field.toLowerCase()}.`, 1);
          $("#pdvref").focus();
          return;
        }
        if (rxNeeded()) {
          if (!farmaCfg().rt.nome) {
            toast(
              "Cadastre o farmacêutico responsável em Mais, Configurações.",
              1,
            );
            return;
          }
          rxModal();
          return;
        }
        const total0 = r2(
          cart.reduce(
            (a, c) =>
              a +
              r2(
                c.qty *
                  ((db.products.find((x) => x.id === c.pid) || {}).price || 0),
              ),
            0,
          ),
        );
        const disc = Math.min(r2(+pdvDisc || 0), total0),
          total = r2(total0 - disc);
        if (pdvPay === "Dinheiro" && pdvRec && +pdvRec < total) {
          toast("O valor recebido é menor que o total da venda.", 1);
          return;
        }
        const wantNf = nfceWanted();
        if (wantNf) {
          const its = cart.map((c) => {
              const p = db.products.find((x) => x.id === c.pid);
              return { name: p.name, fiscal: prodFiscal(p) };
            }),
            miss = missingFiscalNames(its);
          if (miss.length) {
            toast(
              "Falta o NCM de: " +
                miss.join(", ") +
                '. Complete em Produtos → Editar → Dados fiscais, ou desmarque "Emitir NFC-e" nesta venda.',
              1,
            );
            return;
          }
          if (pdvCpf && !validCPF(pdvCpf)) {
            toast(
              "O CPF informado na nota é inválido. Corrija ou deixe em branco.",
              1,
            );
            return;
          }
        }
        let sale, doc;
        try {
          tx(() => {
            // recarrega o estoque atual, valida TUDO antes de baixar; se algo falhar, nada é gravado
            if (!caixaAberto()) throw Error("Abra o caixa antes de vender.");
            const n = ++db.seq.sale,
              cx = caixaAberto();
            sale = {
              id: uid(),
              n,
              ts: Date.now(),
              items: [],
              disc,
              total,
              pay: pdvPay,
              pdvMode: modeKey,
              pdvRef: pdvRef.trim(),
              user: curUser().name,
              status: "ok",
              caixa: cx ? cx.id : "",
            };
            if (pdvRx && rxPids().length) sale.rx = pdvRx;
            cart.forEach((c) => {
              const p = db.products.find((x) => x.id === c.pid);
              if (!p) throw Error("Um produto da venda foi removido.");
              const mv = _apply({
                pid: c.pid,
                type: "saida",
                qty: c.qty,
                reason: "Venda PDV #" + n,
                ref: "PDV#" + n,
                rx: true,
              });
              sale.items.push({
                pid: p.id,
                name: p.name,
                qty: c.qty,
                price: p.price || 0,
                unit: p.unit,
                lots: mv.lots,
              });
            });
            custSaleHook(sale);
            db.sales.push(sale);
            if (wantNf) doc = createNfceDoc(sale, pdvCpf); // a nota nasce junto com a venda; o envio é feito depois e nunca trava o caixa
          });
        } catch (e) {
          load();
          render();
          toast(
            e.message +
              (e.message.includes("somente leitura") ||
              e.message.includes("caixa")

                : " O carrinho foi mantido; ajuste e tente de novo."),
            1,
          );

        pdvRef = "";
        pdvDisc = "";
        pdvRec = "";
        pdvCpf = "";

        pdvCust = "";

        pdvAuth = false;

        render();
        saleDetail(sale.id, true);

          emitDoc(doc.id).then(() => {
            if (window._saleOpen === sale.id) {

              saleDetail(sale.id, true);
            }
          });

      const orderTotal = (order) =>

          (order.payments || []).reduce(
            (sum, payment) => sum + payment.amount,

      const orderRef = (order) => order.ref || `#${order.n}`;

      <div class="card"><h2 style="margin-top:0">Itens</h2>${order.items.length ? order.items.map((item) => `<div class="cartline"><div class="t"><b>${esc(item.name)}</b><small class="muted">${num(item.qty)} ${esc(item.unit)} × ${brl(item.price)}</small></div><b>${brl(item.qty * item.price)}</b>${order.status === "open" && !(order.payments || []).length ? `<div class="step"><button aria-label="Remover uma unidade" onclick="orderSetQty('${order.id}','${item.pid}',${item.qty - 1})">−</button><button aria-label="Adicionar uma unidade" onclick="orderSetQty('${order.id}','${item.pid}',${item.qty + 1})">＋</button><button class="btn ghost sm" onclick="orderTransferModal('${order.id}','${item.pid}')">Transferir</button></div>` : ""}</div>`).join("") : '<p class="muted">Nenhum item neste pedido.</p>'}<div class="tot">${brl(total)}</div><p>Recebido: <b>${brl(paid)}</b> · Em aberto: <b>${brl(due)}</b></p>${order.status === "open" ? `<button class="btn full" onclick="orderPaymentModal('${order.id}')" ${total ? "" : "disabled"}>＋ Registrar pagamento</button><p class="muted">O estoque é baixado ao quitar o pedido.</p>` : order.status === "closed" ? '<span class="badge">Quitado</span>' : '<span class="badge n">Cancelado</span>'}</div>
       ${order.payments?.length ? `<h2>Pagamentos</h2>${order.payments.map((payment) => `<div class="item"><div class="im">💳</div><div class="t"><b>${brl(payment.amount)} · ${esc(payment.pay)}</b><small>${dt(payment.ts)} · ${esc(payment.user)}</small></div></div>`).join("")}` : ""}`;

      let poDraft = null;

            pid: id,
            qty: Math.max(1, Math.ceil(p.min * 2 - p.qty)),
            cost: p.cost,
            received: 0,
          });

        if (!poDraft.lines.length) {
          toast("Adicione pelo menos um produto.", 1);
          return;
        }
        try {
          tx(() => {
            const n = ++db.seq.po;
            db.pos.push({
              id: uid(),
              n,
              sup: poDraft.sup,
              date: Date.now(),
              exp: poDraft.exp,
              status: st,
              lines: poDraft.lines.map((l) => ({ ...l, received: 0 })),
            });

          toast(e.message, 1);
          return;
        }
        closeModal();
        render();
        toast("Pedido salvo.");

          .map((l) => {

       ${can("compras") && ["solicitado", "parcial", "rascunho"].includes(o.status) ? `${o.status === "rascunho" ? `<button class="btn full" onclick="poStatus('${id}','solicitado')">Marcar como solicitado</button><br><br>` : `<button class="btn full" onclick="poReceive('${id}')">📥 Receber mercadoria</button><br><br>`}<button class="btn ghost full" onclick="if(confirm('Cancelar este pedido?'))poStatus('${id}','cancelado')">Cancelar pedido</button><br><br>` : ""}<button class="btn ghost full" onclick="closeModal()">Fechar</button>`);

          `<h1>Receber pedido #${o.n}</h1><p class="muted">Confira as quantidades que chegaram. Elas entram no estoque ao confirmar.</p>${o.lines
            .map((l, i) => {

        );
      }
      function poConfirm(id) {
        const val = (i) => {
          const e = $("#" + i);
          return e ? e.value : "";
        };
        try {
          tx(() => {
            const o = db.pos.find((x) => x.id === id);
            o.lines.forEach((l, i) => {
              const q = +val("rc_" + i) || 0;
              if (q > 0) {
                _apply({
                  pid: l.pid,
                  type: "entrada",
                  qty: q,
                  reason: "Recebimento pedido #" + o.n,

              }
            });
            o.status = o.lines.every((l) => l.received >= l.qty)

              : "parcial";
